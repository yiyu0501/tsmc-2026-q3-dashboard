ss architecture, make the learning curve more challenging or difficult and therefore, the implication to the margin."}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "Well, today’s a situation actually is a little bit different from previous years. Yes, we now have a very strong demand from smartphone and also AI/HPC applications. And so the smaller die size per se or the big die size in the accelerator, they happen at the same time. And this is to TSMC's advantage, let me say that. Because we are good. We have been prepared for this kind of thing. And our results are very excellent, and customers are very happy to work with us. And so the learning curve, yes, but we are doing a reasonable job. And so all the customers are very happy today."}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Okay. Thank you. Operator let's move on to the next participant, please."}, {"sp": "Operator", "ti": "Operator", "sec": "qa", "tx": "Arthur Lai, Macquarie."}, {"sp": "Arthur Lai", "ti": "Analyst", "sec": "qa", "tx": "I have a question on the power as a gating factor. So I want to understand, have power grid constraint led you reduce your customer forecast in the history? Also, could this tighter and tighter power grid supply make your customer actually accelerating adoption of your Super Power Rail product for the better performance per watt?"}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Okay. So Arthur's first question is about the power supply or electricity supply. Is it a gating factor and have we seen that lead to a reduction in customers' forecast. On the other side or on the other hand, with the tighter power electricity supply, have we seen more customers' adoption of super power rail technologies?"}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "Well, let me update that definitely power supply situation is one of the consideration factor that we are looking into. And that's why also we do one more step to double check whether the power supply situation in the US, and we have done all the study and so far, so good, let me we say that. And with this kind of a situation change our customers’ behavior and move more into the backside power rail, the answer is no. Whether you use the backside power, those kind of metallization scheme, is based on your need for your product, okay? So some of the accelerator might be using it. Some of the product like mobile phones, they don't use it. So it depends on customers' product. Did I answer the question?"}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Do you have a second question?"}, {"sp": "Arthur Lai", "ti": "Analyst", "sec": "qa", "tx": "Yes. Thanks, Jeff. So just to recall, the previous discussion on the agentic AI demand on the CPU. So I wonder, according to our previous framework, demand forecast framework, the mid-to high 50s% growth, including the CPU or not? And if we heard our clients increase the CPU forecast significantly, when is the next time we refresh our AI demand growth numbers?"}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Okay. So Arthur's, second question is on -- his question is really on our -- we already stated by anyway, our AI accelerator definition -- he wants to know with the emergence of agentic AI and CPU, -- does that AI accelerator definition include CPUs or not? And if when we will provide inclusion for him."}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "Let me answer the question. It's not included in our AI demand’s calculation -- the reason is very simple because we cannot identify which CPU used in the conventional server CPU or AI server CPU. And also that it depends on our customers' application and their own allocation also. So no, so far today, we stick to our initial, very narrow definition on the AI's demand."}, {"sp": "Arthur Lai", "ti": "Analyst", "sec": "qa", "tx": "Understand. And so if we have seen a very strong CPU driven demand, when we will revise up the --"}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Arthur, I think we already said very clearly, it's not part of the AI accelerator definition, it's a narrow definition. But it is certainly part of our business, okay? Okay. Operator, in the interest of time, can we take questions from the last participant on the line, please?"}, {"sp": "Operator", "ti": "Operator", "sec": "qa", "tx": "Sahej Singh, Stifel Financial."}, {"sp": "Sahej Singh", "ti": "Equity Analyst", "sec": "qa", "tx": "Into 2027, you have N3 turning accretive and now that's crossed over, and N2 is still in its diluted ramp, and the overseas dilution is widening. On the offset side, there have been reports of significant price increases across your mature and advanced nodes. Could you provide some color into perhaps some of that conversation and where pricing does move, does it typically apply across the existing contracted book? Or is it mainly being applied to incremental capacity above what customers have already committed to?"}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Yes. Okay. So -- the first question is talking about -- I guess you're asking about the potential puts and takes for next year. Or you're asking specifically on pricing, sorry -- our pricing, specifically on pricing. Okay. So it's a very specific question that there's reports that we are increasing the price. He wants to know does it apply across the existing contracted commitments from customers? Or is it mainly for the incremental capacity?"}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "Well, we have discussed this kind of thing before that our pricing strategy is very strategic. It also depends on the market segment, depends on the location, and depends on the technology and something. Once we offer the flexibility of the physical location that in the US, it will be a little bit different from the one we produce in Taiwan. So no matter what, when we try to get our value to be recognized, and we will give our shareholders the maximum value of our technologies."}, {"sp": "Sahej Singh", "ti": "Equity Analyst", "sec": "qa", "tx": "Understood. For the second question, something you said in your prepared remarks, which stuck out to me was we will not be leaving food on the table. And earlier, I think it was maybe one or two weeks ago, there was the announcement via GlobalFoundries that they would be providing silicon interposers to TSMC. And so I would love some color into how are you thinking through these strategic decisions in terms of procuring from some of the specialty foundries versus providing in-house."}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Okay. So the second question is, again, he notes that recently, we had an announcement with GlobalFoundries on interposers. How do we view these partnerships and what is our approach strategically."}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "Well, let me answer the question. We designed a deal with GlobalFoundries. And this is part of our overall strategy in the back-end supply. Actually, our number one priority is to help our customers to be successful in their market. We want them to be fully supported by all the supply, including the front end and back end. Definitely, we have a little bit shortage on the back end, and we'd like to work with our so-called partner with GlobalFoundries so that both TSMC and GlobalFoundries can support TSMC's customers for their product to be introduced with enough support and the capacity."}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Okay. Thank you for your questions. Thank you for all the participants. This does conclude our question-and-answer session. Before we conclude today's conference, please be advised that the replay of the conference will be accessible within 30 minutes from now. The transcript will become available 24 hours from now, and you can find both will be available through TSMC's website at www.tsmc.com. So again, thank you for joining us today. We hope everyone continues to stay well. Have a good autumn and we hope you will join us again next quarter. Thank you, and have a good day."}], "prior": [{"sp": "蘇志凱", "ti": "法人關係處處長", "sec": "presentation", "tx": "各位投資界及媒體的朋友們，大家午安。我是台積電法人關係處的蘇志凱。歡迎您參加台積公司2026年第二季的法人說明會。由於本法說會是向全球投資人同時連線轉播，所以我們會全程使用英文，請您見諒。Good afternoon, everyone, and welcome to TSMC's second quarter 2026 earnings conference and conference call. This is Jeff Su, TSMC's Director of Investor Relations and your host for today. Today's event is being webcast live through TSMC's website at www.tsmc.com, where you can also download the earnings release materials. If you are joining us through the conference call, your dial-in lines are in listen-only mode.The format for today's event will be as follows. First, TSMC's Senior Vice President and CFO, Mr. Wendell Huang, will summarize our operations in the second quarter 2026, followed by our guidance for the third quarter 2026. Afterwards, Mr. Huang and TSMC's Chairman and CEO, Dr. C.C. Wei, will jointly provide the company's key messages.Then we will open both the floor and the line for the question and answer session. As usual, I'd like to remind everybody that today's discussions may contain forward-looking statements that are subject to significant risks and uncertainties, which could cause actual results to differ materially from those contained in the forward-looking statements. Please refer to the safe harbor notice that appears in our press release.And now, I would like to turn the microphone over to TSMC's CFO, Mr. Wendell Huang, for the summary of operations and the current quarter guidance."}, {"sp": "黃仁昭", "ti": "副總/財務主管", "sec": "presentation", "tx": "Thank you, Jeff. Good afternoon, everyone. Thank you for joining us today. My presentation will start with financial highlights for the second quarter of 2026. After that, I will provide the guidance for the third quarter of 2026.Now let's move on to revenue by technology. 2-nanometer process technology contributed 3% of wafer revenue in the second quarter. 3-nanometer, 5-nanometer, and 7-nanometer accounted for 30%, 33%, and 11% respectively.Advanced technology, defined as 7-nanometer and below, accounted for 77% of wafer revenue.Moving on to revenue contribution by platform. HPC increased 20% quarter-over-quarter to account for 66% of our second quarter revenue.Smartphone decreased 4% to account for 22%. IoT increased 4% to account for 5%. Automotive increased 15% to account for 4%. DCE increased 5% to account for 1%.Moving on to the balance sheet. We ended the second quarter with cash and marketable securities of 3.5 trillion NT, or 110 billion US dollars.On the liability side, current liabilities increased by 144 billion NT quarter-over-quarter, mainly due to the increase of 58 billion in accounts payable and the increase of 48 billion in accrued liabilities and others.In terms of financial ratios, accounts receivable days increased by 3 days to 29 days. Inventory days increased 7 days to 87 days, primarily due to the ramp of N2 technology.Regarding cash flow and CapEx, during the second quarter, we generated about 783 billion NT in cash from operations, spent 496 billion in CapEx, and distributed 156 billion for third quarter 2025 cash dividends.Overall, our cash balance increased 99 billion NT to 3.1 trillion at the end of the quarter. In US dollar terms, our second quarter capital expenditures totaled 15.7 billion.I've finished my financial summary. Now let's turn to the current quarter guidance. Based on the current business outlook, we expect our third quarter revenue to be between 44.6 billion and 45.8 billion US dollars, which represents a 12% sequential increase, or a 37% year-over-year increase at the midpoint.Based on the exchange rate assumption of 1 US dollar to 32 NT, gross margin is expected to be between 65% and 67%. Operating margin between 56% and 58%. This concludes my financial presentation....very strong. In addition, we continue to leverage our manufacturing excellence to generate more wafer output and drive greater across-node capacity optimization in our fab operations to support our profitability. Finally, we have no control over the foreign exchange rate, but that may be another factor.Next, let me talk about our 2026 capital budget. At TSMC, a higher level of capital expenditures is always correlated to higher growth opportunities in the following years. With our strong technology leadership and differentiation, we are well-positioned to capture the multi-year structural demand from the industry megatrends of 5G, AI, and HPC.Given the continued strong structural demand from our customers, including the newly emerging agentic AI market, we have decided to raise our full year 2026 capital budget to be between 60 and 64 billion US dollars, as we continue to invest heavily to support our customers' growth. We always collaborate closely with the tool suppliers well in advance to prepare the capacity, whether it is a strong upcycle or downcycle.Just like our customers collaborate with us well in advance to plan our capacity. Thus, we do not foresee any bottlenecks to our capacity expansion plans. About 70% to 80% of the 2026 capital budget will be allocated for advanced process technologies. About 10% will be spent for specialty technologies, and about 10% to 20% will be spent for advanced packaging, testing, mask making, and others.Even as we invest for the future growth with this level of CapEx spending in 2026, we remain committed to delivering profitable growth to our shareholders. We also remain committed to a sustainable and steadily increasing cash dividend per share on both an annual and quarterly basis.In 2025, we paid 467 billion NT in cash dividends, up 28.6% year-over-year, as TSMC shareholders received a total of 18 NT cash dividend per share. In 2026, they will receive 24 NT per share, up another 33% year-over-year, and we expect a continued and increasing cash dividend per share in 2027 as well. Now let me turn the microphone over to CC."}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "presentation", "tx": "Thank you, Wendell. Good afternoon, everyone. First, let me start with our near-term demand outlook. We concluded our second quarter with revenue of US 40.2 billion, at the high end of our guidance in US dollar terms, driven by strong demand for our leading-edge process technologies.Moving into third quarter, we expect our business to be supported by continued strong demand for our leading-edge process technologies, including the steep ramp of our 2-nanometer technology. Looking ahead, we observe consumer and price-sensitive end-market segments are being challenged due to the impact of rising component prices and macroeconomic uncertainties.As such, we are being prudent in our business planning, while focusing on our fundamentals of our business to further strengthen our competitive position. Having said that, AI-related demand continues to be extremely robust. The AI megatrend continues to drive the need for more and more computation, which supports the robust demand for leading-edge silicon.Our customers and customers' customer, who are mainly the cloud service provider, continue to provide us with their very strong signal and positive outlook. Thus, our conviction in the multi-year AI megatrend remains very high. Supported by our robust technology differentiation and broad customer base, we now expect our full year 2026 revenue growth to be slightly above 40% year-over-year in US dollar terms.Let me talk about the acceleration of agentic AI. The AI market continues to be very dynamic. The emergence of agentic AI is leading to a resurgence in the role of CPUs in AI data centers, which drives more silicon demand in addition to AI accelerators.We believe this is positive for TSMC, as no matter what CPU approach is taken, whether it's x86, Arm-based, or RISC-V architecture, they are almost all TSMC's customers. We are already collaborating closely with our CPU customers and working to support them with the most advanced technologies and necessary capacity, so they can capture the agentic AI market opportunities.Next, let me talk about TSMC's capacity expansion strategies. To address the structural increase in overall long-term semiconductor market demand profile, TSMC collaborates closely with our customer and our customers' customer to plan our capacity.Given the fundamental complexity of leading-edge technologies and the design-in and lead time involved, we also have a very good idea of their multi-year product roadmap and production plans. This is important because it takes more than 5 years to develop the technology and product, prepare the capacity, and ramp it up to high-volume production.Internally, TSMC employs a disciplined capacity planning system to assess the market demand from both a top-down and bottom-up approach. This is a continuous and ongoing process. Based on our assessment, we are stepping up our CapEx investment to increase our capacity to support our customers' future growth.Now, with the strong collaboration and support from our leading US customers and the US federal, state, and city government, we would like to announce an additional 40 billion US dollar investment in Arizona. This is to build several more semiconductor logical wafer fab for 2-nanometer and below technologies, as well as advanced packaging fabs to support the strong multi-year demand from our leading US customers. We believe this investment will help to further foster the development of the US semiconductor ecosystem, strengthen the supply chain, and support an increasing number of high-tech, high-paying jobs in the United States....operational excellence to drive greater productivity across our fabs in all locations to generate more wafer output. We are also focusing on capacity optimization across nodes, which including flexible capacity support among N7, N5, and N3 nodes. In summary, we are using multiple levers to do everything we can, whatever we can, however we can, to maximize the support to all our customers.Now let me talk about our mature node strategies. TSMC's strategy at mature node has not changed. Our first priority is to fully support our customer, and now we continue to increase, not decrease, our mature node capacity in the high higher value-added segment. For example, we are increasing our mature node capacity through JASM Fab 1 in Japan for CMOS image sensor application, and ESMC in Germany for automotive and industrial applications.In today's market, outside of specific areas such as power management IC and CMOS image sensor, the mature node demand in other commodity area is not that strong. Thus, TSMC will continue to focus on the higher value-added and strategic segment while ensuring we have the necessary capacity to support our customers' growth.Finally, let me talk about our A14 status. As I mentioned a few minutes ago, the complexity of leading-edge technology continues to increase. The lead time to develop a new technology such as A14, building the capacity, and then ramping it up now takes five to seven years. There are no shortcuts. Our A14 technology representing the second generation of nanosheet transistors and deliver another full node stride from N2, with performance and power benefit to address the insatiable need for high performance and energy-efficient computing.Compare with N2, A14 will provide 10% to 15% speed improvement at the same power, or 25% to 30% power improvement at the same speed, and close to 20% chip density gain. A14 technology development is on track and progressing well. Internal product-like vehicles demonstrate close to 90% device performance and close to 90% 256-megabit SRAM yield. We are observing a strong level of customer interest and engagement for both smartphone and HPC AI applications, and customer now tape-out activity is ongoing and ahead of schedules.Risk production will start in 2027, and volume production is scheduled for 2028. With our strategy of continuous enhancement, we also introduced A13 and A12 as extensions of the A14 family. A13 represents a further advancement of A14, achieving an over 6% die area saving through an innovative 93% 97% optical shrink. Through continuous design technology co-optimization, A13 also drive further performance and power efficiency improvement. A13 design rules are backward compatible with A14 to ensure smooth IP migration.We also introduced A12, which will bring our innovative SuperPower Rail technology to the A14 platform for superior performance, power, and area benefits. Both A13 and A12 are scheduled for volume production in 2029. We believe A14 and its derivative technologies will prepare our A14 family to be an even larger and long-lasting node for TSMC than N2, just like 2-nanometer technology is a larger and longer-lasting node than 3-nanometer, and here further extend our technology leadership position well into the future. This concludes our key messages, and thank you for your attention."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "presentation", "tx": "Thank you, CC. So this does conclude our prepared statements. Before we begin the Q&A session, again, I would like to remind everybody to please limit your questions to two at a time to allow all the participants an opportunity to ask their questions. Questions will be taken both from the floor and from the call online. Should you raise to, should you wish to raise your question in Chinese, I will translate it to English before our management answers the question. So for those of you on the call, if you'd like to ask the question, please press star then one on your telephone keypad now. If at any time you'd like to remove yourself from the questioning queue, please press star two. Please note that we will try to conclude today's meeting at around 3:10 or so, so we will try to get in as many participants' questions as possible. But if we're not able to, we do apologize in advance and thank you everyone for your patience. So, operator, well, let's begin the Q&A session. We'll take the first two questions from the floor, and then we'll go online. Maybe again, left, center, right. Maybe we'll take the first question, Sunny Lin from UBS, please."}, {"sp": "Sunny Lin", "ti": "分析師", "sec": "qa", "tx": "Thank you very much. Congratulate on the very strong performance and outlook. So, number one, I'll do a double click on the CapEx. So, very encouraging CapEx outlook, and I do think it's essential that TSMC showcase stronger determination in capacity expansion given the stronger demand and the very tight supply. And so, beyond 2026, I think every large client also wonder how aggressive TSMC is planning for CapEx. And so, back in the COVID supercycle, TSMC did provide a three-year CapEx outlook back then. And so, I wonder at this point, would be possible for you to share any color, maybe for the coming three years' CapEx? Thank you."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay, so Sunny's first question is regarding CapEx. She does believe it's important and essential to show our determination to support our customers with, you know, these large CapEx investments. So she wants to know, do we have a three-year CapEx guidance '26, '27, '28, similar to what we did back in 2021?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "Hey, Sunny. We do not have a number to share with you. But as you know, we invest CapEx this year for the future business opportunity, and as long as there are business opportunities, we are not hesitate to invest. As you can hear from our prepared remarks that our conviction in the megatrend, AI megatrend multi-year, is very strong, and we are stepping up the CapEx, including increasing this year's CapEx. Last time we said our CapEx in the next three years will be significantly higher than the CapEx in the past three years. Now, is the the CapEx in the next three years will be even more significantly higher than the past three years."}, {"sp": "Sunny Lin", "ti": "分析師", "sec": "qa", "tx": "Yeah, well, sorry, maybe let me follow up on CapEx from another... Oh, yeah, sure. So, you just announced additional 100 billion CapEx in the US, and I think that's pretty important for you to secure the business in the US as well. And so now with total 265 billion CapEx in Arizona, what's your current plan to bring up the capacities in Arizona in the coming few years?"}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay, so Sunny's second question is on, to, you know, CC said investing additional 100 billion in Arizona based on the strong demand from our customer. So the total investment now is 265 billion. What is the schedule, timeframe, or the plan for these investments? Is that correct, Sunny? Yeah, okay."}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "Sunny, the schedule will depend on the market situation. You know that. So, today's situation, the megatrend is so strong, so that we announce additional 100 billion investment in Arizona. How many fabs? Many. So actually, let me say that, it probably additional four or more fabs will be built.Yes."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay, thank you. Let's...Okay, thank you. Let's go to the middle. We have Charlie Chan from Morgan Stanley. We'll go left, middle, right from where I sit. Thank you."}, {"sp": "Charlie Chan", "ti": "分析師", "sec": "qa", "tx": "Thanks for taking my question. Good afternoon. So, first of all, congrats for very strong outlook. My first question is really about the foundry competition. I understand that there's no shortcut for a newcomer like Intel, but how about like Samsung Foundry, right? They got a huge profit from memory business. Intel got the US policy support. So, I'm not sure how TSMC is going to address those competition because apparently, several US customers are engaging with those industry peers. And recently, actually yesterday, ASML just announced to expand the EUV capacity for 2028. Is TSMC worried that your competitors to take more slots and build the large capacity in the future to compete with you in the leading-edge business? Thank you."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay, so Charlie's question is competition from two angles. One, you know, he does note CC says foundry competition no shortcuts, but he says according to the news, many of our customers are engaging with our foundry competitors. One of them in Korea is making huge amounts of money these days. Another one may have the US government policy support. So the first part of his question, how do we see the competition and threat of customers moving to our competitors, number one."}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "Well, let me say that. Yes, one of my competitors in South Korea they make a huge amount of money, and I'm jealous about it. And then the other one in the US, they got a very strong US government support. We also got the government support, by the way, although we don't announce it. However, let me share with you, as we said, there's no shortcuts. What does that mean? Meaning that in this semiconductor industry, you have to go back to fundamental. You know, government's help is welcome, really we also appreciate that. A lot of money, of course, that's nice to have. But the most important thing, as we continue to say, is the technology, manufacturing, and customer trust. These three fundamentals never change. For my 30-some, 40 years career, it's always the most important thing. And that's always the TSMC's secret recipe to win the business.So, from my, from the competition point of view, choosing a technology, ramping it up, is not buying a milk from 7-Eleven. Well, I'm using, I'm quoting the sentence from my customer anyway. They said that you choosing a kind of technology partner, there's no shortcuts. You need to understand the technology, you need to really utilize it, using the chip, and then something, and work together, and then prepare the capacity, and ramp it up. That's what I say it takes about 5 years. It's not today you think this milk is better, you go to the next store, 7-Eleven, you don't like it, you go to another store. No. So, that's my answer, Charlie. Is, is agree?"}, {"sp": "Charlie Chan", "ti": "分析師", "sec": "qa", "tx": "Yeah, so hope you can buy more milk so other people cannot get it. Thank you, yeah. So let me switch gears to a more exciting side. CC just said you see a very strong signals from customers' customers. You also revised up the full year revenue guide. Are you ready to revise up the 5-year revenue CAGR, especially the AI semi CAGR? I remember it was like high 50%. But here comes the question, right? That generative AI demand so strong, CPU is a great opportunity for TSMC, but how about those kind of memory cost increase, right? That's kind of big chunk of this kind of AI CapEx. So, what's the update of the AI semi CAGR and how should we look at the contents of the AI semi relative to TSMC's growth? Thank you."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay, so Charlie's second question is regarding the AI-related demand. We do continue to see very strong and positive signals from our customers' customers. We revised up our full year. So his question is around our AI CAGR guidance that we gave in January on a 5-year period, mid-to-high 50s CAGR growth. He's wondering if there's any update to that. Generative AI, a new opportunity. What is our definition of AI accelerator, do we include that, and what is the CAGR?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "Charlie, if you read our message that we continue to invest more, we increase the CapEx with a good reason. So if you asking about the AI's CAGR, let me give you not a number, but it's stronger and stronger and stronger. So, we don't give you the number today because of it continue to increase, so we don't know how to answer this question. But stronger than what we said it before. Okay?"}, {"sp": "Charlie Chan", "ti": "分析師", "sec": "qa", "tx": "Okay, great. Thank you."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Thank you, Charlie. All right, let's move to this side. Maybe we'll take the question from Arthur from Macquarie."}, {"sp": "Arthur", "ti": "分析師", "sec": "qa", "tx": "Hey, first, congrats on the strong execution and performance. My question is regarding the new advanced packaging technology. We notice that especially the EMIB-T is gaining the traction. So how will TSMC react with this request?"}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay, sorry. So Arthur's first question is on advanced packaging and competition. I guess very simply put, EMIB-T in his view is gaining traction, so how do we see the competitive threat from this?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "Well, let me say that. Our packaging capacity is so tight that now it's limit my customers' growth. So we welcome that additional flexibility in the market. And so that will help TSMC's front-end wafer business growth, which is a majority part of TSMC's business. The technology looks good, according to the newspaper. And we hope it will be successful, and so that share some of the loading from TSMC. Today we working very hard to shorten the gap between the demand and the capacity. And so, as I said, we welcome to have this additional alternatives, and so the flexibility for my customer."}, {"sp": "Arthur", "ti": "分析師", "sec": "qa", "tx": "Thank you, that make a lot of sense. So a follow-up, so as this is a new technology, right? So if your clients, they ask your support, and our value is support our customers' success, right? How TSMC will handle this special request?Sorry, your question is... So if this technology is have some small problem, and then ask our company to support, so how our company, you know, accommodate it?"}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "So Arthur's question is, if there's some issues with this technology, do we have a way, or I don't know how to say it, is there an alternative plan?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "Yeah, let me answer the question. Our number one is to support our customers' success. So whatever that we can help our customer, the business, we will do it. Did that answer your question? Okay."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay. Let's come back, we'll take one more here and then we'll go online and then back to the room. Oh, yeah, Gokul."}, {"sp": "Gokul Hariharan", "ti": "分析師", "sec": "qa", "tx": "Yeah, hi. Thanks CC and Jeff. First question on, maybe since you're not wanting to give a longer-term numerical guidance, could you talk a little bit about the philosophy of how you are expanding capacity? Obviously, customer feedback, customers' customers' feedback is important. Do you also consider competitive pressure? Because as a outright market leader, having like under-supply for very long period of time is not really desirable for TSMC, right? You probably want a market which is more balanced. So when you think about your capacity expansion, like how long do you think it takes to fulfill...the demand as you see right now? That's one. And second, CoWoS obviously is the current shortage, but there is also a lot of discussion about data center delay, power capacity being available. So could you also share some thoughts on how you are layering in that kind of concerns? Because you don't want your chips to be available but having to wait for the data center deployment to happen. So just to understand how that goes into your planning framework as well. Thank you."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "So Gokul's first question is again, how do we plan our capacity and determine the capacity expansion plan? Certainly, we take into consideration the demand, multi-year demand from our customers and customers' customers. But do we also consider the competitive pressure from competitors building capacity? Is that part of our calculus to expand the capacity, one? And then also, what about things outside of chips, like data center delays or power, these type of deals?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "Gokul, that's a good question. Definitely, every time when we think about business, we consider the competition. That's our number one. And then we look at where we are. And then we decide a bottom-up and then top-down assessment of all the demand. Those are the typical things, I mean, in our daily life. So we make a lot of judgment, and then we be more careful. We talk to customer and customer's customer, those are the CSPs. And then we get all their input for the demand.And then we make a judgment. Now, remember that I believe every customer tell me the truth, everyone. You put all the truth together, it's not the truth. So we have to make some of the judgment. You know what I mean, right? You know, since you are laughing. Because all the customer are very aggressive, right? That's a CEO's job. CEO got to be aggressive. So they give me the number of their demand, and I believe they try their best to tell me the truth. So I put all together, all the truth together is not a truth.Mark down that word. So, yes, we do a very careful judgment. Might not be correct, might not be correct, but we did carefully. And because this is a big money, right? This year we say we increase the capex from 30, from 28 to 32, now 30 to 32, now 30 to 32. And that's a big money. So we do it carefully. So we did all the assessment, and that lead to your second question. Are we sure that we deliver the chips to our customer and they will not put into inventory? So we actually we are checking the AI data center's progress, the building, the location, the demand, the racks. We checking all that to make sure that TSMC's chips will not be put in inventory. Did I answer your question?"}, {"sp": "Gokul Hariharan", "ti": "分析師", "sec": "qa", "tx": "Yeah, that's clear. So CC, do you, do you still believe even end of next year we are still going to be running short of supply even with this elevated capacity build-out plans?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "You want me to give you a guarantee, right? Let me say that. I believe from this year all the way to probably 2029, 2030, the demand is very strong. Whether in between there's a dip or not, I'm not very sure. But the trend is so robust that I believe we are witnessing a kind of a new industry. I would like to say the new industry called the AI industry, which is so common in our daily life because it's going to affect our automotive, affect the humanoid robot, and also impact to all the industry. So by the amount of money we put in, I mean, including all the CSPs, this is alone is a very important new industry to the world. And so the demand will be there. And the fundamental thing is semiconductor chips. And most of them in TSMC."}, {"sp": "Gokul Hariharan", "ti": "分析師", "sec": "qa", "tx": "Thanks CC. My second question is on your profitability. So CC, you joked that you are definitely jealous of your memory competitor on their margins. But it definitely feels like profitability-wise, longer-term foundry, especially leading-edge foundry, should be higher than memory, looking at number of competitors out there. So as you are investing for a lot of your customers, how is that discussion going? Because you are no longer the most profitable semiconductor manufacturing company at this point in time. So you probably have less pressure in terms of passing on your value and capturing your value right now compared to maybe one year back."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay. So Gokul's second question is on profitability and pricing to a certain extent. Of course, some of the memory makers are making very good profitability and margins today, but he notes the role of foundry could be even more value, and TSMC's role as well. So what should be the right way to think about the long-term profitability for a foundry? Should it be better? And then I guess really pricing into this, what type of pricing approach do we want to take?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "Yeah, Gokul, your question actually simple. You know, what is the wafer pricing strategy for TSMC and what kind of gross margin we should have? The higher the better, of course. But we are a partner. A partner meaning that, I said many times, our customer got to be successful. I don't want to squeeze them out from the market. And besides, we are a very trustable company with our customers. So we don't suddenly increase our price by, which I like to have, 4x or 5x. You know, it's, you cannot survive for that kind of, for your customer to survive for that kind of price increase. So we earn our value, and we make sure that our profit, our gross margin is enough for our long-term sustaining expansion. That's to the benefit of my customer and TSMC also. That's our philosophy. So...Yes, I'm really jealous about memory company's 86% gross margin. 86, if I'm 68, I will be happy. But, alright, anyway, so I answer the question. We are very trustable."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Thank you. Okay, thank you. Operator, can we take the next two questions from participants on the line, please?"}, {"sp": "Jim Fontanelli", "ti": "分析師", "sec": "qa", "tx": "Yeah, thank you. Thank you. So, could I ask about the risk that you see around customer concentration as AI demand continues to significantly outgrow other end markets? You know, your exposure to your top five customers is becoming meaningfully larger than at any point in your history, so I'd just like to understand how you see that risk."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay. So Jim's first question is risk around customer concentration. We have large customers that are getting larger. Are we worried that we have too many big customers or the customer concentration?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "No, that's not our concern. Besides what you say, the customers are growing bigger and bigger, we are very happy about it. And some of the customers are also growing very fast. So, it's not, Jim, it's not what you said that the bigger customer is going bigger and bigger. No. I mean, that's, there's a lot of new players in the AI industry."}, {"sp": "Jim", "ti": "分析師", "sec": "qa", "tx": "Yes. So, with some of your direct customers putting capital into both financing, investing, and investing in AI demand, is that something that TSMC is considering?"}, {"sp": "Jeff Su", "ti": "處長", "sec": "qa", "tx": "So, Jim's second question, he notes some of our customers...So, Jim's second question, he notes some of our customers are, you know, helping to invest in their customers. Jim, if I understand you right, correctly, you're asking if TSMC, if this is an approach we would take to invest in our customers? Is that correct? Or financing and investing?"}, {"sp": "Jim", "ti": "分析師", "sec": "qa", "tx": "In your end, in the end customers, not your direct customers."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Right, so in customers' customers as well."}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "To answer, Jim, to answer your question directly, every company has a different consideration, and every company has a different strategy. So far, no, TSMC don't do this kind of financial arrangement because of we think we are working with current customer with the current model smoothly and also successfully."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay, thank you. Operator, can we move on to the next participant on the line, then we'll come back to the floor."}, {"sp": "司儀", "ti": "司儀", "sec": "qa", "tx": "Next one to ask questions, Gokul Hariharan from JPMorgan."}, {"sp": "Gokul Hariharan", "ti": "分析師", "sec": "qa", "tx": "Yes, next one, this is Gokul. One go back to the $100 billion investment in US. Is there any way you can give us some timeline, is it over the next 3 years, 5 years? How should we think about the progression of this $100 billion investment in US? And I have a follow-up."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "So Gokul's first question is around the announced today additional $100 billion investment in the US. In terms of the capex timeframe, is it in the next 3 years, in the 5 years? Do we have any schedule or timeframe to share about this additional $100 billion?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "We do have a plan, but let me share with you, actually the progress or the schedule, most of the time depend on the market situation and our customers' demand. So, if you ask me to give you a firm schedule, no, we don't have it today. But we do have a plan. And we speed it up, we try to speed it up as fast as possible."}, {"sp": "Gokul Hariharan", "ti": "分析師", "sec": "qa", "tx": "So the preference is, you're flexible but also you're expediting the investment in US, is that correct?"}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "So his, well, I think, CC said we're trying to move as fast as we can, but everything is based on our customer needs."}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "Yeah, we also moving the new fabs and the facilities in Taiwan as fast as possible. And the same thing we try to bring up a new fab in Japan as fast as possible, because of the situation today is, the demand and the supply, the gap is so big, so we are working very hard to narrow the gap."}, {"sp": "Gokul Hariharan", "ti": "分析師", "sec": "qa", "tx": "You have a, yeah, and I want to follow up, actually I want to dive into the compute part of HPC. And I want to ask you about networking switches. In that context, when should we expect the CoWoS platform to have a material contribution to your top line?"}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "So Gokul's second question, very specific, he wants to know for our CoWoS platform, when will it have a very meaningful contribution to the business?"}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay, thank you. Let's come back to the floor. We'll take the next question from Citi, Laura Chen."}, {"sp": "Laura Chen", "ti": "分析師", "sec": "qa", "tx": "Thank you. Thank you very much for taking my questions. My first question is also about very promising outlook as TSMC raised the capex and also the growth outlook for this year. In particularly, I think CC you mentioned about the organic AI and the CPU growth potential. But can you give us more update among that AI different kind of chips, between GPU, accelerators, or CPU, what you see the growth potential and your visibility? Thank you."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "So Laura's first question is around sort of the outlook. We obviously raised the capex and growth outlook for this year. She wants to know within the AI, the outlook for, you know, organic AI and CPUs versus AI accelerators, GPUs, etc. How do we see these segments?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "Laura, I don't think I can give you a very specific number, but let me share with you, all of them are in TSMC. And they're also using the same kind of leading-edge technologies. We working with our customer to allocate the wafer, the supply, to balance the CPU, GPU, XPU ratio."}, {"sp": "Laura Chen", "ti": "分析師", "sec": "qa", "tx": "Okay, thank you. That makes sense. And then my second question is also about advanced packaging. We know that during the symposium, TSMC previously already announced a 14 times reticle CoWoS roadmap to enable larger AI packaging. But at the same time, we also noted that TSMC, maybe last month in Japan, showed the substrate development for CoWoS to enable some of the glass technology. So I'm just wondering if you can give us more like technology progress update on the different kind of technology for glass core or glass substrates or glass carrier? What's the progress at TSMC right now? Thank you."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "So Laura's second question is on advanced packaging. She notes as we said, we roadmap to even larger than 14x reticle size with CoWoS. But she also wants to know the technology process in newer areas like glass substrates, glass cores, what is the progress and status?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "We are, let me say that, today the majority is still CoWoS, right? And we are developing that alternative, try to lower down the cost. And we also work with substrate vendor so that our customer can have their product be in the market. The progress, we're building a pilot line that I announced a few quarters ago. And it will take about another one year to be mature, so we can put into the production with our customer."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay. Thank you. Let's move to this side of the room. Bank of America, Charles Shi, sorry."}, {"sp": "Charles Shi", "ti": "分析師", "sec": "qa", "tx": "Yes, thanks CC, Wendell, and Jeff for taking my questions, and congrats on the great results. My first question is regarding your capex and sales. You gave pretty solid capex outlook for this year and also said the capex outlook in the next couple of years will continue to be pretty significant. And you also raised this year's at 40% plus. So should we be able to provide your next couple of years' sales growth outlook, try to quantify it? And relatedly, I think also that topic is whether you can try to break down which part of the demand you are seeing as the key driver for you to raise your capex and also for this year's demand. Is it still mostly driven by cloud computing, or is it proliferating to edge computing? Or to some extent, is it also related to your equipment supply chain is raising their price as well? Thank you."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay, that's several questions in one, so I'm going to take that as one and a half questions at least. But Charles is asking, with the capex increase and the revenue increase this year, I think he's trying to look at intensity, but he wants to know what about the revenue guidance for the next several years?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "Okay, let me answer that question. Because of the revenue corresponding to our investment, right? Because of we forecast our demand, and then we make a assessment, and then we do the capex. Next few years is going to be a very good business for TSMC, that what I can say."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "And then the other part, so what's the key driver? Is it cloud AI, is it edge AI, is it because tool vendors are increasing their price?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "It's all AI-related. Everything."}, {"sp": "Charles Shi", "ti": "分析師", "sec": "qa", "tx": "You have a quick follow-up?Yes, I think it is more on your long-term strategy because a lot of people have actually been asking about your capex and also competition on the front end. But I would actually say that if on the back end...I think it is more on your long-term strategy because a lot of people have actually been asking about your capex and also competition on the front end. But I would actually say that if on the back end competition is rising, especially coming from Intel EMIB, are you worried that your value-add for this, your overall foundry business across front-end manufacturing to the back-end packaging business, the value-add could actually be cannibalized with growing competition? Thank you."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay. Thank you. So Charles's second question is around the competition in advanced packaging. If our competitors are able to gain traction or business with things like EMIB, would that be the gateway or an entry way into more competitive threat on the front-end logic wafer side? So does advanced packaging lead to front-end wafer loss?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "Charles, let me answer that. The front-end wafer business and the back-end business are two different things, right? If they are the same, then you can expect ASE to become the front-end competitor also. It's too different, too different things. And I also say that since our capacity in the back-end is so in shortage mode, the gap is bigger, and so I welcome that the competitor offer some of the flexibility to my customer so that their front-end wafer can be put into the package and that help TSMC's front-end wafer business. That's our attitude."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay. Thank you. Thank you. Operator, let's take one more from the online and then we'll wrap up with back in person."}, {"sp": "司儀", "ti": "司儀", "sec": "qa", "tx": "Next one to ask question, Rob Sanders from Deutsche Bank."}, {"sp": "Rob Sanders", "ti": "分析師", "sec": "qa", "tx": "Yeah, thanks for taking my question. You recently stated that High-NA tools were too expensive, but could you please discuss how your customers are considering the impact of die stitching challenges from a smaller field size with High-NA? Could that actually slow the adoption of High-NA even if the tech improves or the tech gets more productive? And I have a follow-up, thanks."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "All right. Rob's first question is very specific technology on around High-NA adoption. He wants to know the customer's feedback on the challenges with die stitching. Is this an impediment or barrier to High-NA adoption in our view?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "You've got a very detailed understanding of the High-NA. Today, the field size is only one-half, and we put that one into our consideration of the manufacturing cost and something. Again, let me answer this question quickly. Whether we use the High-NA or not, actually, one, High-NA is a very good tool. Let's assume that, all right? We understand it's a very high, high performance. But then TSMC made it clear that we work with ASML and try to make it more suitable for manufacturing in terms of the cost and in terms of the maturity. So we always consider that technology maturity and the cost and whether we use it or not. Okay?"}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay. Thank you, C.C. Do you have a second question, Rob?"}, {"sp": "Rob Sanders", "ti": "分析師", "sec": "qa", "tx": "Yeah, just a quick, just a quick follow-up. I think all of us on this call are assuming that the unconstrained demand for 3nm, 2nm, A16 is sort of 30% to 50% above your ability to supply. Is it in fact much larger than 30% to 50%? It feels like it might be, based on what you're saying, because I think all of us are assuming it's sort of solvable over the next three, four years. But it sounds like the number could be much larger. Thanks."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Well, those are your numbers, but Rob is asking, the, you know, the demand in excess of supply, is it 30% to 50%? Is it something even larger? Do we have a number to share?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "No, we don't have a number to share because of, let me say that, the gap is very big. It is, yes. Sorry, I don't want to make a comment on the memory, but a very big gap."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay. We have about 9 minutes left. We'll come back to the floor with any questions. Let's take one from here, Evelyn Yu from Goldman Sachs."}, {"sp": "Evelyn Yu", "ti": "分析師", "sec": "qa", "tx": "Thank you for taking my question. Since we mentioned a lot on that we're going to step up our capacity growth, I just try to quantify here because I noticed that during the symposium, that you actually mentioned about 2nm family capacity growth will be growing at around 70% CAGR from 2026 to 2028, and N3 plus N5 to grow by 25% CAGR from 2022 to 2027. So I'm wondering, are those numbers still right assumptions today? Are we seeing actually any changes over the past quarter and how should we compare with the non-supporting demand out there?"}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay. So Evelyn's first question is around capacity growth. She knows during the symposium, we did share some, you know, five-year CAGR growth numbers for 2nm around 70% CAGR, and then 3nm around, I guess, I can't remember the exact, but 25%. So are those numbers still the same or has it changed now that our capex and stuff?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "Did we say that in technology symposium? Oh, we showed the chart. Okay, now is bigger. That's all I can say."}, {"sp": "Evelyn Yu", "ti": "分析師", "sec": "qa", "tx": "Okay. Thank you. Very good direction. All right. My other question is touch based on the advanced packaging side, because you always bundle the advanced packaging capex together with testing, mask making and others, that's around 10% to 20% of total capex.Okay, thank you. Very good direction. All right, my other question is touch based on the advanced packaging side. Because you always bundle the advanced packaging capex together with testing, mask making, and others, that's around 10% to 20% of total capex. And so one thing I'm trying to figure out here is that how much of that actually goes to advanced packaging alone? And because given that advanced packaging is capital intensive, less capital intensive versus front-end, so how should we think about the gap between its pricing revenue share and its capex share over the next few years? And well, I think finally is that as it becomes more important, how should we think of maybe you should consider breaking it out as a separate capex item going forward?"}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay, so Evelyn's question is around advanced packaging. She wants to know when we guide for the capex, of course we guide it in a bucket of packaging, testing, mask making, and others together. Why do we not separate out just into packaging specifically? Her suggestion is we should. But I think more, so that's part of it, number one, the capex breakdown."}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "Evelyn, let me say that. We try very hard to make sure that our capex number is correct, but with the flexibility between the front-end and the back-end. Sometimes we have a bottleneck, so we put more money to buy the bottleneck tools. And sometimes it's in the front-end, sometimes it's in the back-end. But in the ballpark, the percentage is just like we share with everybody. For long term, I mean that the back-end is about 10% to 20%. Oh, that's a big range. Anyway, so that we... what I can say is that still 10% to 20%. Because of, as I said, actually I'm very honest to tell you that as time goes by, some of the customers' product need more tester. You cannot believe that. I mean, so the tester in shortage is so we need to put more capex in the tester, or in the packaging, or in other areas. So that's why we we cannot very specifically say which area we put how much of the capex. That's too specific. Yeah."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay, we'll... the last participant, KGI Felix Pang. Thank you for being patient."}, {"sp": "Felix Pang", "ti": "分析師", "sec": "qa", "tx": "Hello, good afternoon. Thank you for taking my question. So my first question is regarding to the capex revision. So from year-to-date, so 台積電 raised the capex guidance by almost 10... yeah, 10 billion US dollars. So can you give me some color where is the upside from? How you guys see the different from six months ago? Aside from like CPU accelerator or memory combination or back-end CoWoS expansion, just the upside, how how we see things differently from six months ago?"}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Okay, so Felix is noting in January we guided for 52 to 56 billion, in April we said closer to 56, now 60 to 64. So we have increased the capex guidance. What is driving this? Is it agentic AI only? Is it packaging? Is it AI accelerator?"}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "Well, simply put, the most important reason is because of the demand continue to increase, andwe feel the pressure from the customer to drive TSMC, not drive actually, to cooperate with TSMC for the capacity increase. That's one of the major reason.The second reason is inflation. Now we buy the tools with inflation price. Okay, you understand what I say. Okay."}, {"sp": "Felix", "ti": "分析師", "sec": "qa", "tx": "Thank you. So my second question is about the mature nodes. So people always focus on AI, leading nodes, but it seems like mature nodes also seeing a very strong demand recovery and also some supply issue as well. So how you guys see the demand supply dynamic and pricing for the mature nodes? Because apparently there is some impact from the AI crowding out effect, but mature nodes still largely depends on the consumer demand. So consumer demand is still weak, so how you guys see the demand supply dynamic for the mature nodes? Thank you."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "So Felix's second question is on mature node. He notes there's lots of talk that mature nodes are seeing a strong demand recovery and the supply is very tight, so mature node pricing is very favorable or strong. So he wants to know how do we see the mature node supply-demand situation."}, {"sp": "魏哲家", "ti": "董事長/總經理", "sec": "qa", "tx": "Actually, the mature node cover a lot of different segment. Only the one with related to AI is in shortage. Which is the most important one is number one is power management IC because of all the AI data center need a lot of power management.And those are the mature node technology like 0.18 micron, 90 nanometer, or something like that. Those are in shortage, definitely. And also, the sensor portion, because of you need a lot of sensor to detect the environmental information and put into the AI data center to analyze it. Other than that, other area, just like you pointed out, the consumer product is not in a high demand, and so other segment is not so strong demand. And as I pointed out in my statement, other area, no, it's not so much of, say, in a lot of shortage. Not at all. Okay."}, {"sp": "Jeff Su", "ti": "主持人", "sec": "qa", "tx": "Thank you. Thank you, CC. Thank you, Wendell. Thank you, everyone. This does conclude our Q&A session. Before we conclude today's conference, please be advised that the replay of the conference will be accessible within 30 minutes from now. The transcript will become available 24 hours from now, and both are going to be available through our website again at www.tsmc.com. If some of you were not able to ask your question, please feel free to reach out to TSMC IR, and we will follow up with you. So thank you everyone for joining us today. We hope everyone can continue to stay well, have a good summer, and we hope you'll join us again next quarter. Thank you and have a good day."}]}, "qmap": {"we expect our fourth quarter revenue to be between USD52.3 billion and USD54.3 billion, which represents a 14% sequential increase or a 58% year-over-year increase at the midpoint.": [["cur", 2, 2457, 2636]], "gross margin is expected to be between 65% and 67%, operating margin between 56.5% and 58.5%.": [["cur", 2, 2696, 2788]], "gross margin is expected to be between 65% and 67%. Operating margin between 56% and 58%.": [["prior", 1, 2122, 2210]], "we now expect our full year 2026 revenue growth to be around 44% year-over-year in US dollar terms.": [["cur", 3, 1018, 1116]], "we now expect our full year 2026 revenue growth to be slightly above 40% year-over-year in US dollar terms.": [["prior", 2, 1312, 1418]], "we reiterate our full year 2026 capital budget to be between USD60 billion and USD64 billion.": [["cur", 2, 4756, 4848]], "we have decided to raise our full year 2026 capital budget to be between 60 and 64 billion US dollars": [["prior", 1, 3020, 3121]], "We continue to expect our CapEx dollars investment from 2026 to 2028 and to be even more significantly higher than the past three years": [["cur", 2, 4850, 4985]], "We do not have a number to share with you.……the CapEx in the next three years will be even more significantly higher than the past three years.": [["prior", 6, 12, 53], ["prior", 6, 543, 641]], "we now expect the gross margin dilution from the ramp-up of our overseas fabs to be closer to 2% for the full year 2026.": [["cur", 2, 3688, 3807]], "Thus, we expect the dilution from our overseas fabs to widen to 3% to 4% in the next few years.": [["cur", 2, 3931, 4025]], "We expect our N2 family technology’s annual capacity to more than double in 2027": [["cur", 3, 4159, 4239]], "Risk production is well on track for 2027, and volume production will start in 2028.": [["cur", 3, 4536, 4619]], "Risk production will start in 2027, and volume production is scheduled for 2028.": [["prior", 2, 5819, 5898]], "Volume production will begin in third quarter '27, slightly ahead of our previous schedule.": [["cur", 3, 5611, 5701]], "we have decided to add on additional 3-nanometer fab in Tainan, volume production is scheduled for the first half of 2028.": [["cur", 3, 5366, 5487]], "As such, we are being prudent in our business planning going into 2027": [["cur", 3, 665, 735]], "In US dollar term, revenue increased 16.2% sequentially to $46.7 billion": [["cur", 2, 359, 431]], "66.4%, primarily due to margin dilution from 2-nanometer ramp.": [["cur", 2, 547, 608]], "Operating margin was 58.7%.": [["cur", 2, 670, 696]], "Overall, our third quarter EPS reached TWD29.43, and ROE was 45.5%.": [["cur", 2, 698, 764]], "2-nanometer process technology contributed 8% of wafer revenue in the third quarter": [["cur", 2, 810, 893]], "Advanced technologies, defined as 7-nanometer and below, accounted for 79% of wafer revenue.": [["cur", 2, 988, 1079]], "HPC increased 22% quarter-over-quarter to account for 68% of our third quarter revenue.": [["cur", 2, 1128, 1214]], "Inventory days decreased by 5 days to 82 days, primarily due to the increase in wafer shipment.": [["cur", 2, 1837, 1931]], "Overall, our cash balance increased TWD488 billion to TWD3.6 trillion at the end of the quarter.": [["cur", 2, 2151, 2246]], "In US dollar terms, our third quarter capital expenditures totaled USD13.8 billion.": [["cur", 2, 2248, 2330]], "And we did not see any sign of slowdown whether it's high 50% CAGR, it doesn't matter, it probably will be higher.": [["cur", 12, 77, 190]], "And so far, I think our plan is to use it in 2030.": [["cur", 15, 143, 192]], "Gokul, I think it's a bit too early to talk about capacity increase percentage going forward.": [["cur", 22, 6, 98]], "This is necessary because of all our customers, most of large customers in U.S. and they request that TSMC to increase the capacity.": [["cur", 25, 62, 193]], "It's not either way, it would be possible, but the fab got to be run by TSMC.": [["cur", 28, 45, 121]], "The principle of TSMC is we do not allow our customers to sublet or auction off the capacity.": [["cur", 33, 100, 192]], "We always evaluate a new tool -- and if we want to put into the mass production, it got to be the best technology with a very reasonable cost.": [["cur", 36, 27, 168]], "Well, Charlie, as I said, to be frank with you, I don't comment on a specific customer, but let me guarantee you that we take everything into consideration.": [["cur", 46, 0, 155]], "I try to avoid to answer it directly, but let me say that.": [["cur", 52, 0, /* ── count-up: animates the first number inside a string, keeps the rest ── */
function countUp(el, str, dur=1100){
  const m=String(str).match(/[+−-]?\d[\d,]*(\.\d+)?/);
  if(!m||RM){ el.textContent=str; return; }
  const raw=m[0], dec=(m[1]||'').length-1>0?(m[1].length-1):0, sign=/^[−-]/.test(raw)?-1:1;
  const target=parseFloat(raw.replace(/[,−+-]/g,''))*sign, pre=str.slice(0,m.index), post=str.slice(m.index+raw.length), comma=raw.includes(',');
  const t0=performance.now();
  (function step(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,4); let v=(target*e);
    let s=Math.abs(v).toFixed(dec); if(comma) s=Number(s).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
    el.textContent=pre+(raw.startsWith('+')?'+':'')+(v<0||(sign<0)?'−':'')+s+post; if(p<1) requestAnimationFrame(step); else el.textContent=str; })(t0);
}

/* 評價儀表：指針跟著滑鼠走，放開後用彈簧回到實際評價 */
function buildDial(){
  const R=D.rating||{}, idx=Math.max(0,RATINGS.indexOf(R.overall)), NS='http://www.w3.org/2000/svg';
  const W=420,H=250,cx=210,cy=215,r1=120,r2=176;
  const s=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const svg=s('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':`整體評價：${R.overall||''}`});
  const pt=(deg,r)=>{const a=(deg-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const segs=[];
  for(let i=0;i<5;i++){
    const a0=-90+i*36+1.2,a1=-90+(i+1)*36-1.2;
    const [x0,y0]=pt(a0,r2),[x1,y1]=pt(a1,r2),[x2,y2]=pt(a1,r1),[x3,y3]=pt(a0,r1);
    const p=s('path',{class:'seg',d:`M${x0},${y0} A${r2},${r2} 0 0 1 ${x1},${y1} L${x2},${y2} A${r1},${r1} 0 0 0 ${x3},${y3}Z`,fill:'#1d3a66'});
    svg.append(p); segs.push(p);
    const [lx,ly]=pt(-90+(i+.5)*36,r2+20);
    const t=s('text',{x:lx,y:ly,'text-anchor':'middle','dominant-baseline':'middle','font-size':'13','font-weight':i===idx?'700':'500',fill:i===idx?'#ffffff':'#9fb4cf'}); t.textContent=RATINGS[i]; svg.append(t);
  }
  for(let k=0;k<=30;k++){const d=-90+k*6,[a,b]=pt(d,r1-6),[c,e]=pt(d,r1-(k%5?12:18));svg.append(s('line',{x1:a,y1:b,x2:c,y2:e,stroke:'#9fb4cf','stroke-width':k%5?1:1.6,opacity:.6}));}
  const needle=s('g',{});
  needle.append(s('path',{d:`M${cx-7},${cy} L${cx},${cy-r2+10} L${cx+7},${cy}Z`,fill:'#ffffff'}));
  needle.append(s('circle',{cx,cy,r:14,fill:'#1970b8',stroke:'#ffffff','stroke-width':3}));
  svg.append(needle);
  const target=-90+(idx+.5)*36;
  let ang=-90, vel=0, goal=target, dragging=false, hovering=false, raf=0;
  const lbl=h('strong',{text:R.overall||''}), hint=h('div',{class:'dial-hint',text:'把滑鼠移到儀表上，看每一級代表什麼'});
  const items0=(D.outlook||{}).items||[], up0=items0.filter(i=>i.vs_prior==='上修').length, dn0=items0.filter(i=>i.vs_prior==='下修').length, ts0=(D.tone_scores||{}).presentation;
  const basis=[items0.some(i=>i.vs_prior)?`指引上修 ${up0} 項、下修 ${dn0} 項`:null, ts0?`講稿語調 ${fmtScore(ts0.score)}`:null].filter(Boolean).join('，');
  const desc=h('div',{class:'dial-desc'}); const how=h('button',{class:'linkish',type:'button',text:'怎麼評的'}); how.addEventListener('click',()=>openDrawer('method'));
  let shown=-2;
  function setDesc(i){ if(i===shown) return; shown=i;
    if(i<0){ desc.replaceChildren(basis?`依據：${basis}。`:'',h('small',{},LEVEL_DEF[R.overall]||'')); }
    else desc.replaceChildren(h('b',{text:RATINGS[i]+'：'}),LEVEL_DEF[RATINGS[i]]); }
  function paint(){ needle.setAttribute('transform',`rotate(${ang} ${cx} ${cy})`);
    const cur=Math.min(4,Math.max(0,Math.floor((ang+90)/36)));
    segs.forEach((p,i)=>p.setAttribute('fill', i===idx?'#1970b8':(i===cur&&(hovering||dragging)?'#2f5c96':'#1d3a66')));
    lbl.textContent=(hovering||dragging)?RATINGS[cur]:(R.overall||''); lbl.style.opacity=(hovering||dragging)&&cur!==idx?.55:1; setDesc((hovering||dragging)?cur:-1); }
  function tick(){ const k=(hovering||dragging)?.12:.075, c=(hovering||dragging)?.72:.86;  // 放開後較軟，會晃一下
    vel=(vel+(goal-ang)*k)*c; ang+=vel; paint();
    if(Math.abs(vel)>.01||Math.abs(goal-ang)>.05) raf=requestAnimationFrame(tick); else {ang=goal;paint();raf=0;} }
  const kick=()=>{ if(!raf) raf=requestAnimationFrame(tick); };
  function aim(e){ const b=svg.getBoundingClientRect(), x=(e.clientX-b.left)*W/b.width-cx, y=(e.clientY-b.top)*H/b.height-cy;
    let d=Math.atan2(x,-y)*180/Math.PI; goal=Math.max(-88,Math.min(88,d)); kick(); }
  svg.addEventListener('pointerenter',e=>{hovering=e.pointerType==='mouse';if(hovering)aim(e);});
  svg.addEventListener('pointermove',e=>{if(hovering||dragging)aim(e);});
  svg.addEventListener('pointerdown',e=>{dragging=true;svg.setPointerCapture(e.pointerId);aim(e);});
  const release=()=>{dragging=false;hovering=false;goal=target;vel+= (target>ang?-6:6);kick();};
  svg.addEventListener('pointerup',release); svg.addEventListener('pointerleave',()=>{if(!dragging)release();}); svg.addEventListener('pointercancel',release);
  if(RM){ang=target;paint();} else { paint(); setTimeout(()=>{vel=4;kick();},450); }
  setDesc(-1);
  const box=h('div',{class:'dial-box rv'},svg,h('div',{class:'dial-label'},h('small',{text:'整體評價'}),lbl),desc,h('div',{class:'dial-hint'},hint.textContent+'　',how));
  requestAnimationFrame(()=>box.classList.add('in'));
  return box;
}

/* 關鍵字：會掉下來、可以抓起來丟的球。球的大小依出現次數 */
function buildPit(){
  const K=(D.keywords||[]).filter(k=>k.count>0);
  const pit=h('div',{class:'pit',role:'list','aria-label':'關鍵字與出現次數'});
  const maxC=Math.max(1,...K.map(k=>k.count));
  const balls=K.map(k=>{ const r=Math.round(34+40*Math.sqrt(k.count/maxC));
    const el=h('div',{class:'ball '+(k.type==='risk'?'risk':'pos'),role:'listitem',style:`width:${r*2}px;height:${r*2}px;font-size:${Math.max(12,Math.min(18,r/3.3))}px`},
      h('span',{'data-s':'1',text:k.word}),h('small',{class:'num',text:k.count+' 次'}));
    pit.append(el); return {el,r,x:0,y:0,vx:0,vy:0,drag:false}; });
  const legend=h('div',{class:'pit-legend'},h('span',{},h('i'),'正面議題'),h('span',{},h('i',{class:'r'}),'風險議題'),h('span',{text:'球越大，出現次數越多；可以拖曳、丟出去'}));
  const reset=h('button',{class:'pit-reset',type:'button',text:'重新落下'}); legend.append(reset);
  const wrap=h('div',{},pit,legend);
  let W=0,H=0,running=false,visible=false,last=0;
  const place=(b)=>{b.el.style.transform=`translate3d(${b.x-b.r}px,${b.y-b.r}px,0)`;};
  function drop(){ W=pit.clientWidth;H=pit.clientHeight; balls.forEach((b,i)=>{b.x=b.r+Math.random()*(W-2*b.r); b.y=-b.r-i*70-Math.random()*40; b.vx=(Math.random()-.5)*4; b.vy=0; place(b);}); }
  function staticLayout(){ // 減少動態：直接排好
    W=pit.clientWidth;H=pit.clientHeight; let x=8,y=H-8,row=0;
    [...balls].sort((a,b)=>b.r-a.r).forEach(b=>{ if(x+2*b.r>W-8){x=8;y-=row*2+6;row=0;} b.x=x+b.r;b.y=y-b.r;x+=2*b.r+6;row=Math.max(row,b.r);place(b);}); }
  function step(t){
    const dt=Math.min(2,(t-last)/16.7||1); last=t;
    for(const b of balls){ if(b.drag) continue; b.vy+=.55*dt; b.vx*=.995; b.vy*=.995; b.x+=b.vx*dt; b.y+=b.vy*dt;
      if(b.x<b.r){b.x=b.r;b.vx=-b.vx*.6;} if(b.x>W-b.r){b.x=W-b.r;b.vx=-b.vx*.6;}
      if(b.y>H-b.r){b.y=H-b.r;b.vy=-b.vy*.45;b.vx*=.92; if(Math.abs(b.vy)<.6)b.vy=0;} }
    for(let it=0;it<3;it++) for(let i=0;i<balls.length;i++) for(let j=i+1;j<balls.length;j++){
      const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,m=a.r+b.r;
      if(d<m){ const o=(m-d)/2,nx=dx/d,ny=dy/d, ma=a.drag?0:1, mb=b.drag?0:1, s=ma+mb||1;
        a.x-=nx*o*2*ma/s; a.y-=ny*o*2*ma/s; b.x+=nx*o*2*mb/s; b.y+=ny*o*2*mb/s;
        const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny; if(rv<0){ const imp=-rv*.8; if(ma){a.vx-=imp*nx*.5;a.vy-=imp*ny*.5;} if(mb){b.vx+=imp*nx*.5;b.vy+=imp*ny*.5;} } } }
    balls.forEach(place);
    if(visible) requestAnimationFrame(step); else running=false;
  }
  const go=()=>{ if(!running&&visible){running=true;last=performance.now();requestAnimationFrame(step);} };
  // 拖曳：記錄最近的移動速度，放開時丟出去
  balls.forEach(b=>{ let px=0,py=0,pt=0;
    b.el.addEventListener('pointerdown',e=>{ b.drag=true; b.el.setPointerCapture(e.pointerId); const r=pit.getBoundingClientRect(); px=e.clientX-r.left; py=e.clientY-r.top; pt=performance.now(); b.vx=b.vy=0; });
    b.el.addEventListener('pointermove',e=>{ if(!b.drag) return; const r=pit.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,now=performance.now(),dt=Math.max(8,now-pt)/16.7;
      b.vx=(x-px)/dt; b.vy=(y-py)/dt; b.x=Math.max(b.r,Math.min(W-b.r,x)); b.y=Math.max(b.r,Math.min(H-b.r,y)); px=x;py=y;pt=now; if(RM)place(b); });
    const up=()=>{ if(!b.drag) return; b.drag=false; b.vx=Math.max(-40,Math.min(40,b.vx)); b.vy=Math.max(-40,Math.min(40,b.vy)); };
    b.el.addEventListener('pointerup',up); b.el.addEventListener('pointercancel',up); });
  // 滑鼠劃過會把球撥開
  pit.addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse'||RM) return; const r=pit.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    balls.forEach(b=>{ if(b.drag) return; const dx=b.x-x,dy=b.y-y,d=Math.hypot(dx,dy); if(d<b.r+30&&d>0){ const f=(b.r+30-d)/(b.r+30)*1.6; b.vx+=dx/d*f; b.vy+=dy/d*f-.3; } }); });
  reset.addEventListener('click',()=>{ if(RM){staticLayout();return;} drop(); go(); });
  if('IntersectionObserver' in window){ let first=true; new IntersectionObserver(es=>es.forEach(x=>{ visible=x.isIntersecting; if(visible){ if(first){first=false; if(RM)staticLayout(); else drop();} if(!RM) go(); } }),{threshold:.25}).observe(pit); }
  addEventListener('resize',()=>{ const w=pit.clientWidth; if(w&&w!==W){W=w;H=pit.clientHeight; if(RM)staticLayout();} });
  return wrap;
}

  $$('[data-s]').forEach(el=>{ const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); const ns=[]; while(w.nextNode()) ns.push(w.currentNode);
    ns.forEach(n=>{ const t=n.nodeValue; if(!re.test(t)) return; re.lastIndex=0; const f=document.createDocumentFragment(); let l=0,m;
      while((m=re.exec(t))){ f.append(t.slice(l,m.index)); const mk=document.createElement('mark'); mk.textContent=m[0]; f.append(mk); marks.push(mk); l=m.index+m[0].length; }
      f.append(t.slice(l)); n.parentNode.replaceChild(f,n); }); });
  hits.classList.add('show'); if(!marks.length){hitTxt.textContent='沒有符合的原文';return;} show(0);
}
function show(i){ if(!marks.length) return; cur=(i+marks.length)%marks.length; marks.forEach((m,j)=>m.classList.toggle('cur',j===cur));
  hitTxt.textContent=`${cur+1}／${marks.length}`; const m=marks[cur];
  const qi=m.closest('.qitem'); if(qi){ qi.classList.remove('hide'); if(!qi.classList.contains('open')) qi.querySelector('.qbtn').click(); }
  const kc=m.closest('.kcard'); if(kc){ const back=!!m.closest('.back'); kc.classList.toggle('flip',back); }
  const gc=m.closest('.gcard'), H=window.__hs;
  if(gc&&H&&!H.isStatic()){ // 換算成直向捲動位置，讓那張卡滑到畫面裡
    const p=Math.min(1,Math.max(0,(gc.offsetLeft-innerWidth*.25)/Math.max(1,H.maxX)));
    const top=H.hs.getBoundingClientRect().top+scrollY+p*(H.hs.offsetHeight-H.sticky.offsetHeight);
    scrollTo({top,behavior:RM?'auto':'smooth'}); return; }
  if(gc&&H&&H.isStatic()) H.track.scrollTo({left:gc.offsetLeft-20,behavior:RM?'auto':'smooth'});
  setTimeout(()=>{ const r=m.getBoundingClientRect(); scrollTo({top:r.top+scrollY-innerHeight/2,behavior:RM?'auto':'smooth'}); },qi?380:0);
}
let st; q.addEventListener('input',()=>{clearTimeout(st);st=setTimeout(()=>search(q.value),250);});
q.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault(); if(marks.length) show(cur+(e.shiftKey?-1:1)); else search(q.value);} if(e.key==='Escape'){q.value='';search('');} });
$('#prev').addEventListener('click',()=>show(cur-1)); $('#next').addEventListener('click',()=>show(cur+1));
addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q.focus();} });
})();
</script>
