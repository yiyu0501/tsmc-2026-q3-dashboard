<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台積電 2026 Q3 法說會儀表板</title>
<style>
:root{
  --ink:#0d0d0d; --grey:#717171; --app:#f8f8f8; --surface:#fff; --line:#dadada;
  --primary:#1970b8; --link:#186eb4; --navy:#204383; --deep:#0b2140; --deep2:#12305c;
  --cyan:#2cb1b1; --tint:rgba(32,67,131,.1); --mark:#fff3a6; --on-dark:#e9f1fa; --on-dark-2:#9fb4cf;
  --hdr:64px; --slant:clamp(16px,3.5vw,56px);
  --up:#d62f3c; --down:#14915a; --hdr-bg:rgba(255,255,255,.92); --back:#f3f7fb; --foot:#eeeeee; --input:#ffffff; --rail:#e8edf3; --rail-l:#c9d3df; --pin-ring:#ffffff;
  --font:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --ink:#e8ecf1; --grey:#9aa6b2; --app:#0f1318; --surface:#181d24; --line:#2c3440;
  --primary:#4d9ee0; --link:#7db8ec; --navy:#a9c3e6; --tint:rgba(169,195,230,.14); --mark:#6b5d12;
  --hdr-bg:rgba(15,19,24,.9); --back:#1c2633; --foot:#151a20; --input:#11161c; --rail:#2a3442; --rail-l:#1f2833; --pin-ring:#181d24; --deep:#0a1a33; --up:#ff6b74; --down:#3ccf8e;}}
:root[data-theme="dark"]{--up:#ff6b74; --down:#3ccf8e; color-scheme:dark; --ink:#e8ecf1; --grey:#9aa6b2; --app:#0f1318; --surface:#181d24; --line:#2c3440;
  --primary:#4d9ee0; --link:#7db8ec; --navy:#a9c3e6; --tint:rgba(169,195,230,.14); --mark:#6b5d12;
  --hdr-bg:rgba(15,19,24,.9); --back:#1c2633; --foot:#151a20; --input:#11161c; --rail:#2a3442; --rail-l:#1f2833; --pin-ring:#181d24; --deep:#0a1a33;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hdr-bg)}
*{box-sizing:border-box}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--app);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.dark :focus-visible{outline-color:#fff}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:99;background:var(--surface);color:var(--ink);padding:8px 12px}

/* ── header ── */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--hdr);background:var(--hdr-bg);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
header .wrap{height:100%;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);flex-shrink:0}
.brand img{height:34px;width:auto;border-radius:6px}
footer img{border-radius:6px}
.logo-d{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none!important}:root:not([data-theme="light"]) .logo-d{display:inline-block!important}}
:root[data-theme="dark"] .logo-l{display:none!important}:root[data-theme="dark"] .logo-d{display:inline-block!important}
.brand b{display:block;font-size:17px;letter-spacing:1px;line-height:1.15}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--grey);letter-spacing:.3px}
nav.toc{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:safe center}
nav.toc::-webkit-scrollbar{display:none}
nav.toc a{white-space:nowrap;text-decoration:none;color:var(--grey);font-size:14px;font-weight:600;padding:6px 10px;border-radius:4px;transition:color .2s,background .2s}
nav.toc a:hover{color:var(--link)}
nav.toc a.on{color:var(--primary);background:rgba(25,112,184,.1)}
.search{display:flex;align-items:center;gap:6px;flex-shrink:0}
.search input{width:180px;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;font-size:14px;background:var(--input);color:var(--ink);transition:width .25s}
.search input:focus{width:240px;outline:2px solid var(--primary);outline-offset:-1px}
.search .hits{font-size:13px;color:var(--grey);white-space:nowrap;display:none;align-items:center;gap:4px}
.search .hits.show{display:flex}
.search .hits button{border:1px solid var(--primary);background:var(--surface);color:var(--primary);border-radius:4px;height:28px;padding:0 8px;font-size:12px;font-weight:600}
.progress{position:absolute;left:0;bottom:-1px;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--primary)}
mark{background:var(--mark);color:inherit;padding:0 1px}
mark.cur{outline:2px solid var(--primary)}

/* ── shared section ── */
section{position:relative;padding:88px 0}
section.dark{background:var(--deep);color:var(--on-dark);clip-path:polygon(0 var(--slant),100% 0,100% calc(100% - var(--slant)),0 100%);padding:calc(88px + var(--slant)) 0;margin:calc(var(--slant) * -1) 0}
section.dark::before,.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:28px}
.sec-no{font-size:14px;font-weight:700;color:var(--primary);border:1.5px solid currentColor;border-radius:4px;padding:1px 7px;line-height:1.5}
.dark .sec-no{color:#7fb6e6}
.sec-head h2{margin:0;font-size:clamp(26px,3.6vw,40px);line-height:1.2;letter-spacing:.5px}
.dark .sec-head h2{color:#fff}
.lead{max-width:760px;font-size:17px;line-height:1.85;margin:0 0 12px}
.dark .lead{color:var(--on-dark)}
.sub{font-size:14px;color:var(--grey)}
.dark .sub{color:var(--on-dark-2)}
.quote{font-size:14px;line-height:1.6;color:var(--grey)}
.quote::before{content:"原文　";font-weight:700;color:var(--navy)}
.dark .quote{color:var(--on-dark-2)}.dark .quote::before{color:#7fb6e6}

/* chips */
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid var(--primary);color:var(--primary)}
.chip.fmt{border-color:transparent;background:var(--tint);color:var(--navy)}
.chip.flat{border-color:var(--line);color:var(--grey)}
.chip.solid{background:var(--primary);color:#fff}
.dark .chip{border-color:#7fb6e6;color:#a9d0f2}
.dark .chip.fmt{background:rgba(255,255,255,.12);color:#dbe7f5;border-color:transparent}
.dark .chip.flat{border-color:rgba(255,255,255,.28);color:var(--on-dark-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* reveal: only one orchestrated entrance per section */
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

/* ── hero ── */
.hero{position:relative;background:var(--deep);color:var(--on-dark);padding:72px 0 calc(110px + var(--slant));clip-path:polygon(0 0,100% 0,100% calc(100% - var(--slant)),0 100%);overflow:hidden}
.hero .wrap{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.hero .wrap.solo{grid-template-columns:minmax(0,820px)}
.crumb{font-size:14px;color:var(--on-dark-2);margin-bottom:14px}
.crumb span+span::before{content:"／";margin:0 6px;opacity:.6}
.hero h1{margin:0 0 20px;font-size:clamp(32px,5.2vw,58px);line-height:1.12;color:#fff;letter-spacing:1px}
.hero h1 .tk{display:block;font-size:.42em;letter-spacing:2px;color:#7fb6e6;margin-bottom:10px;font-weight:700}
.hero .summary{font-size:17px;line-height:1.9;max-width:620px;color:var(--on-dark);margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:36px;border-top:1px solid rgba(255,255,255,.18)}
.stat{padding:16px 12px 0 0}
.stat b{display:block;font-size:clamp(28px,3.4vw,40px);line-height:1.1;color:#fff}
.stat span{font-size:13px;color:var(--on-dark-2)}
.dial-box{position:relative;text-align:center;user-select:none;-webkit-user-select:none;touch-action:none}
.dial-box svg{width:100%;max-width:600px;height:auto;display:block;margin:0 auto;overflow:visible;cursor:grab}
.dial-box svg:active{cursor:grabbing}
.dial-label{margin-top:-6px}
.dial-label small{display:block;font-size:13px;color:var(--on-dark-2)}
.dial-label strong{display:block;font-size:52px;line-height:1.2;color:#fff;letter-spacing:4px}
.dial-hint{font-size:12.5px;color:var(--on-dark-2);margin-top:6px;opacity:.85}
.seg{transition:fill .25s}
.cue{position:absolute;left:50%;bottom:calc(var(--slant) + 24px);transform:translateX(-50%);font-size:12px;color:var(--on-dark-2);text-align:center;letter-spacing:2px}
.cue i{display:block;width:12px;height:12px;margin:6px auto 0;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px) rotate(45deg)}}

/* ── outlook horizontal sequence ── */
.hs{position:relative}
.hs-sticky{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));height:calc(100vh - var(--hdr) - env(safe-area-inset-top,0px));display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.hs-sticky>.wrap{width:100%}
.hs-title{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}.hs-title b{font-size:20px;color:var(--link)}
.hs-bar{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.hs-count{font-size:14px;font-weight:700;color:var(--navy);white-space:nowrap;min-width:108px}
.hs-count b{font-size:26px;color:var(--primary);margin-right:2px}
.ticks{display:flex;gap:4px;flex:1}
.ticks i{flex:1;height:8px;background:rgba(25,112,184,.13);transition:background .3s}
.ticks i.up{box-shadow:inset 0 -3px 0 var(--navy)}
.ticks i.on{background:var(--primary)}
.hs-legend{font-size:12.5px;color:var(--grey);white-space:nowrap}
.hs-legend i{display:inline-block;width:14px;height:8px;background:rgba(25,112,184,.13);box-shadow:inset 0 -3px 0 var(--navy);vertical-align:middle;margin-right:4px}
.track{display:flex;gap:20px;will-change:transform;padding:8px 20px 24px max(20px,calc((100vw - 1200px)/2 + 20px))}
.gcard{flex:0 0 min(380px,82vw);background:var(--surface);border:1px solid var(--line);padding:22px 22px 18px;position:relative;display:flex;flex-direction:column;gap:10px;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s,box-shadow .35s;min-height:360px}
.gcard.up{border-top:4px solid var(--primary)}
.gcard.act{transform:translateY(-8px);border-color:var(--primary);box-shadow:8px 8px 0 rgba(25,112,184,.16)}
.gcard .idx{position:absolute;right:16px;top:10px;font-size:52px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(25,112,184,.25)}
.gcard h3{margin:4px 0 0;font-size:21px;color:var(--link);padding-right:64px}
.gcard .val{font-size:19px;font-weight:700;line-height:1.45}
.gcard .quote{margin-top:auto;padding-top:12px;border-top:1px dashed var(--line);max-height:9.6em;overflow:auto}
.end-card{flex:0 0 min(300px,70vw);display:flex;flex-direction:column;justify-content:center;gap:8px;padding:20px;color:var(--navy)}
.end-card b{font-size:22px}

/* ── conclusion + rating blocks ── */
.cr{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:start}
.meter{margin-bottom:30px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.meter-top span{font-weight:700;color:#fff;font-size:17px}
.meter-top b{font-size:34px;color:#fff;line-height:1}
.meter-top b small{font-size:15px;color:var(--on-dark-2);margin-left:2px}
.blocks{display:grid;grid-template-columns:repeat(20,1fr);gap:4px}
.blocks i{height:18px;background:rgba(255,255,255,.1);transition:background .2s}
.blocks i.f{background:#4d9ee0}
.blocks.navy i.f{background:#a9c3e6}
.meter p{margin:8px 0 0;font-size:14px;color:var(--on-dark-2)}

/* ── key data flip cards ── */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;perspective:1100px}
.kcard{position:relative;height:230px;border:0;padding:0;background:none;text-align:left;cursor:pointer;outline-offset:3px;transform-style:preserve-3d;transition:transform .12s ease-out}
.kcard .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.kcard.flip .in{transform:rotateY(180deg)}
.kface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:6px}
.kface.back{transform:rotateY(180deg);background:var(--back);border-color:var(--primary);overflow:auto}
.kface .m{font-weight:700;color:var(--link);font-size:19px;line-height:1.35}
.kface.back .m{font-size:16px}
.kface .v{font-size:24px;font-weight:700;line-height:1.25;margin-top:auto}
.kface .c{font-size:14px;color:var(--grey)}
.kface .row{display:flex;justify-content:space-between;align-items:center}
.kface .flip-hint{font-size:12px;color:var(--grey)}
.kface.back .quote{font-size:14.5px;color:var(--ink);opacity:.85}
.kcard:hover .kface.front{border-color:var(--primary)}
.kshine{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(25,112,184,.12),transparent 55%);opacity:0;transition:opacity .2s}
.kcard:hover .kshine{opacity:1}

/* ── tone ── */
.tone-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.tone-card{background:var(--surface);border:1px solid var(--line);padding:22px}
.tone-card h3{margin:0 0 4px;font-size:18px;color:var(--link)}
.tone-score{font-size:46px;font-weight:700;line-height:1.1;margin:6px 0 14px}
.scale{position:relative;height:36px;margin:0 6px 28px}
.scale .rail{position:absolute;left:0;right:0;top:14px;height:8px;background:linear-gradient(90deg,var(--rail-l),var(--rail) 50%,rgba(77,158,224,.4));}
.scale .mid{position:absolute;left:50%;top:6px;width:1px;height:24px;background:var(--grey)}
.scale .pin{position:absolute;top:2px;left:50%;width:16px;height:32px;margin-left:-8px;background:var(--primary);border:3px solid var(--pin-ring);box-shadow:0 0 0 1px var(--primary);transition:left 1.4s cubic-bezier(.2,.9,.3,1.15)}
.scale .lbl{position:absolute;top:38px;font-size:12px;color:var(--grey);transform:translateX(-50%)}
.tone-card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.tone-card dt{color:var(--grey)}
.tone-card dd{margin:0}

/* ── QA ── */
.dist{display:flex;height:14px;margin:6px 0 10px;overflow:hidden}
.dist i{height:100%;transition:flex-grow 1s cubic-bezier(.2,.8,.2,1)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px}
.tab{border:1.5px solid rgba(255,255,255,.3);background:transparent;color:var(--on-dark);border-radius:4px;height:36px;padding:0 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background .2s,border-color .2s,transform .15s}
.tab:active{transform:scale(.96)}
.tab i{width:10px;height:10px;display:inline-block}
.tab em{font-style:normal;font-size:12px;opacity:.75}
.tab[aria-pressed=true]{background:#fff;color:var(--deep);border-color:#fff}
.qlist{display:flex;flex-direction:column;gap:10px}
.qitem{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);transition:background .2s,opacity .3s,transform .3s}
.qitem.hide{display:none}
.qitem.open{background:rgba(255,255,255,.1);border-color:rgba(127,182,230,.6)}
.qbtn{width:100%;display:grid;grid-template-columns:44px 1fr auto 32px;gap:12px;align-items:center;background:none;border:0;padding:14px 16px;text-align:left}
.qno{font-weight:700;color:#7fb6e6;font-size:15px}
.qq{font-weight:700;color:#fff;font-size:16.5px;line-height:1.5}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.qtag{font-size:13px;color:var(--on-dark-2);align-self:center;margin-right:4px;border-left:1px solid rgba(255,255,255,.28);padding-left:8px}
.plus{width:28px;height:28px;border:1.5px solid rgba(255,255,255,.6);position:relative;transition:transform .3s}
.plus::before,.plus::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2px;background:#fff;transform:translate(-50%,-50%)}
.plus::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .3s}
.qitem.open .plus{transform:rotate(180deg)}.qitem.open .plus::after{transform:translate(-50%,-50%) rotate(0)}
.qbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.qitem.open .qbody{grid-template-rows:1fr}
.qbody>div{overflow:hidden}
.qbody .pad{padding:0 16px 16px 72px}
.qbody .ans{margin:0 0 8px;font-size:15.5px;color:#fff}
.qbody .who{font-size:13px;color:var(--on-dark-2);margin-bottom:6px}

/* ── attendees & keywords ── */
.ak{display:grid;grid-template-columns:.8fr 1.2fr;gap:40px;align-items:start}
.att{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.att div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.att b{color:var(--link)}
.att p{margin:0}.att small{display:block;color:var(--grey);font-size:13px}
.pit{position:relative;height:380px;background:var(--surface);border:1px solid var(--line);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.pit::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--primary)}
.ball{position:absolute;left:0;top:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:grab;will-change:transform;line-height:1.15;font-weight:700;padding:4px}
.ball:active{cursor:grabbing}
.ball.pos{background:var(--primary);color:#fff}
.ball.risk{background:var(--surface);border:2px solid var(--navy);color:var(--navy)}
.ball small{font-weight:600;opacity:.8;font-size:11px;margin-top:2px}
.pit-legend{display:flex;gap:16px;font-size:13px;color:var(--grey);margin-top:10px;flex-wrap:wrap}
.pit-legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px;background:var(--primary)}
.pit-legend i.r{background:var(--surface);border:2px solid var(--navy)}
.pit-reset{margin-left:auto;border:1px solid var(--primary);background:var(--surface);color:var(--primary);border-radius:4px;font-size:12px;font-weight:600;height:26px;padding:0 10px}

/* ── footer ── */
footer{background:var(--foot);padding:40px 0 48px;margin-top:40px;font-size:14.5px;line-height:1.8}
footer img{height:60px;width:auto;margin-bottom:10px}
footer p{margin:0}

.top{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:0;background:var(--primary);color:#fff;box-shadow:0 3px 1px -2px rgba(0,0,0,.2),0 2px 2px 0 rgba(0,0,0,.14),0 1px 5px 0 rgba(0,0,0,.12);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;transform:translateY(10px);z-index:40}
.top.show{opacity:1;pointer-events:auto;transform:none}
.top svg{width:18px;height:18px}


/* ── 動作按鈕、前次數值 ── */
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.abtn{border:1px solid var(--line);background:var(--surface);color:var(--link);border-radius:4px;height:30px;padding:0 10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:border-color .2s,background .2s,color .2s}
.abtn:hover{border-color:var(--primary)}
.abtn.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.abtn svg{width:14px;height:14px;flex-shrink:0}
.dark .abtn{background:transparent;border-color:rgba(255,255,255,.3);color:#cfe2f6}
.dark .abtn.on{background:#fff;color:var(--deep);border-color:#fff}
.prior{font-size:14px;color:var(--grey);line-height:1.5}
.prior .pl{display:inline-block;font-size:12px;font-weight:700;color:var(--navy);background:var(--tint);padding:0 6px;border-radius:3px;margin-right:6px}
/* ── 首頁：這場的重點變化 ── */
.chg{margin-top:30px}
.chg-t{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.5}
.chg-t caption{text-align:left;font-size:13px;color:var(--on-dark-2);font-weight:500;padding-bottom:8px;line-height:1.6}
.chg-t th{text-align:left;font-size:12.5px;font-weight:600;color:var(--on-dark-2);padding:8px 10px 8px 0;border-bottom:1px solid rgba(255,255,255,.3)}
.chg-t td{padding:10px 10px 10px 0;border-bottom:1px solid rgba(255,255,255,.12);vertical-align:top}
.chg-t td.k{color:#fff;font-weight:700;white-space:nowrap}
.chg-t td.f{color:var(--on-dark-2)}
.chg-t td.t{color:#fff;font-weight:700}
.chg-t td.r{text-align:right;padding-right:0}
.chg-t th:nth-child(2),.chg-t th:nth-child(3){width:36%}
.chg h2{font-size:14px;color:var(--on-dark-2);margin:0 0 4px;font-weight:600;letter-spacing:.5px}
.chg-row{display:grid;grid-template-columns:7.5em 1fr auto;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.16)}
.chg-row b{color:#fff;font-size:15px}
.chg-row .ft{font-size:15px;line-height:1.5}
.chg-row .from{color:var(--on-dark-2)}
.chg-row .arr{color:#7fb6e6;margin:0 6px}
.chg-row .to{color:#fff;font-weight:700}
.hero-acts{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{height:44px;padding:0 18px;border-radius:6px;font-weight:700;font-size:15px;border:1.5px solid #fff;background:#fff;color:#0b2140;display:inline-flex;align-items:center;gap:8px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.btn svg{width:18px;height:18px}
/* ── header 報告稿按鈕 ── */
.hbtn{height:36px;border-radius:8px;border:1px solid var(--primary);background:var(--primary);color:#fff;font-weight:700;font-size:14px;padding:0 12px;display:inline-flex;gap:6px;align-items:center;flex-shrink:0;white-space:nowrap}
.hbtn .n{min-width:20px;height:20px;border-radius:10px;background:#fff;color:#1970b8;font-size:12px;display:none;align-items:center;justify-content:center;padding:0 5px}
.hbtn .n.show{display:inline-flex}
.hbtn.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.12)}}
/* ── 抽屜：報告稿＋逐字稿 ── */
.scrim{position:fixed;inset:0;background:rgba(5,15,30,.45);z-index:79;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:var(--surface);color:var(--ink);z-index:80;transform:translateX(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.dw-head{display:flex;align-items:center;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dw-tab{border:0;background:none;font-size:16px;font-weight:700;color:var(--grey);padding:6px 10px;border-radius:4px}
.dw-tab[aria-selected=true]{color:var(--primary);background:rgba(25,112,184,.1)}
.dw-close{margin-left:auto;width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:20px;line-height:1;color:var(--ink)}
.dw-pane{flex:1;display:none;flex-direction:column;min-height:0}
.dw-pane.on{display:flex}
.fmts{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px 0}
.fmt{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;height:34px;padding:0 12px;font-size:14px;font-weight:600}
.fmt[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff}
.fmt em{font-style:normal;font-size:12px;opacity:.8;margin-left:4px}
.fmt-desc{padding:8px 16px 0;font-size:13px;color:var(--grey);margin:0}
.draft{flex:1;margin:10px 16px 0;padding:14px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:15px;line-height:1.75;resize:none;background:var(--app);color:var(--ink);min-height:200px}
.draft:focus{outline:2px solid var(--primary);outline-offset:-1px}
.dw-foot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);margin-top:12px}
.dw-foot .cnt{font-size:13px;color:var(--grey);margin-right:auto}
.dw-foot .copy{height:40px;padding:0 18px;border-radius:6px;border:0;background:var(--primary);color:#fff;font-weight:700;font-size:15px}
.dw-foot .reset{height:40px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--grey);font-size:14px;font-weight:600}
.src{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.src .sub{margin-left:auto}
.tx{flex:1;overflow:auto;padding:0 16px 24px;scroll-behavior:smooth}
.sg{padding:12px 0;border-bottom:1px solid var(--line);transition:background .4s}
.sg.target{background:rgba(25,112,184,.08);margin:0 -16px;padding:12px 16px 12px 13px;border-left:3px solid var(--primary)}
.sg-who{font-size:13px;font-weight:700;color:var(--link);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sg-who small{font-weight:500;color:var(--grey)}
.sg p{margin:4px 0 0;font-size:14.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--app);padding:10px 18px;border-radius:6px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:95}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ── 未來展望：清單模式 ── */
.hs-title{flex-wrap:wrap}
.hs-tools{margin-left:auto;display:flex;gap:6px}
.olist{display:none;padding:4px 0 8px}
.ow.list .hs{display:none}
.ow.list .olist{display:block}
.olist .tbl{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
.olist table{width:100%;border-collapse:collapse;min-width:900px;font-size:14.5px}
.olist .abtn{white-space:nowrap}
.olist th{background:var(--app);text-align:left;font-size:13px;color:var(--grey);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.olist td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.olist td.t{font-weight:700;color:var(--link);white-space:nowrap}
.olist td.p{color:var(--grey)}
.olist tr:last-child td{border-bottom:0}
@media (max-width:960px){ .chg-row{grid-template-columns:1fr auto} .chg-row .ft{grid-column:1/-1;grid-row:2} .hbtn .lbl{display:none} }
@media print{ .drawer,.scrim,.toast,.acts,.hero-acts,.hbtn{display:none!important} }


.rev{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:700;white-space:nowrap;line-height:1}
.rev svg{width:18px;height:12px;flex-shrink:0}
.rev.up{color:var(--up)}.rev.down{color:var(--down)}.rev.flat{color:var(--grey);font-weight:600}
.dark .rev.up,.hero .rev.up{color:#ff7a82}.dark .rev.down,.hero .rev.down{color:#4fd69a}.dark .rev.flat{color:var(--on-dark-2)}
.ticks i.up{box-shadow:inset 0 -3px 0 var(--up)!important}
.hs-legend i{box-shadow:inset 0 -3px 0 var(--up)!important}
.gcard.up{border-top-color:var(--up)!important}
/* 方法說明 */
.mth h3{font-size:17px;color:var(--link);margin:22px 0 8px}.mth h3:first-child{margin-top:4px}
.mth p,.mth li{font-size:14.5px;line-height:1.75;margin:0 0 6px}
.mth ul{padding-left:20px;margin:0 0 8px}
.mth table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 10px}
.mth td,.mth th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.mth th{color:var(--grey);font-size:12.5px}
.mth tr.me td{background:rgba(25,112,184,.08)}
.mth tr.me td:first-child{font-weight:700;color:var(--primary)}
.mth .note{font-size:13px;color:var(--grey);background:var(--app);padding:10px 12px;border-radius:6px}
.mth details{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0}
.mth summary{cursor:pointer;font-weight:700;font-size:14px}
.mth .wl{font-size:13.5px;line-height:1.9;color:var(--ink);margin-top:6px}
.dw-pane[data-pane=method]{overflow:auto;padding:16px}
/* 逐字稿：來源列可換行、找詞模式 */
.src{flex-wrap:wrap}
.src .sub{margin-left:0;flex-basis:100%;font-size:13px}
.wnav{display:none;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--app);font-size:14px;flex-wrap:wrap}
.wnav.on{display:flex}
.wnav b{color:var(--primary)}
.wnav .sp{margin-left:auto;display:flex;gap:6px}
.tx mark.cur{outline:2px solid var(--primary);outline-offset:1px}
/* 語調詞 */
.wchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.wchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;height:30px;padding:0 11px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;transition:border-color .2s,transform .15s}
.wchip:hover{border-color:var(--primary)}.wchip:active{transform:scale(.96)}
.wchip em{font-style:normal;font-weight:700;color:var(--grey);font-size:12.5px}
.wchip.pos em{color:var(--primary)}.wchip.neg em{color:var(--up)}
.wchip .fl{font-size:11px;color:var(--grey)}
.tone-card h4{margin:14px 0 4px;font-size:13px;color:var(--grey);font-weight:600}
.linkish{border:0;background:none;color:var(--link);font-weight:700;font-size:14px;padding:0;text-decoration:underline;text-underline-offset:3px}
.dark .linkish{color:#a9d0f2}
/* 評價儀表說明 */
.dial-desc{font-size:15px;color:var(--on-dark);max-width:460px;margin:8px auto 0;min-height:3.2em;line-height:1.6}
.dial-desc small{display:block;color:var(--on-dark-2);font-size:12.5px;margin-top:2px}
/* 出席人員 */
.att-h{font-size:14px;color:var(--grey);font-weight:700;margin:18px 0 6px}
.att-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 20px;border-top:2px solid var(--ink)}
.att-grid.one{grid-template-columns:1fr}
.an{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.an b{color:var(--link)}.an span{font-size:13.5px;color:var(--grey)}.an em{font-style:normal;font-size:12.5px;color:var(--grey);grid-row:1/3;grid-column:2;align-self:center}
.qorg{font-size:13px;color:#dbe7f5;font-weight:600;white-space:nowrap;align-self:center}
.pick-empty{margin:10px 16px 0;padding:16px;border:1px dashed var(--line);border-radius:6px;font-size:14.5px;line-height:1.8;display:none}
.pick-empty.on{display:block}
.pick-empty ol{margin:6px 0 0;padding-left:20px}
@media (max-width:600px){ .att-grid{grid-template-columns:1fr} }

@media (max-width:1180px){ nav.toc{display:none} }
@media (max-width:960px){
  nav.toc{display:none}
  .search input{width:130px}.search input:focus{width:170px}
  .hero .wrap,.cr,.ak,.tone-grid{grid-template-columns:1fr}
  .hero .wrap{gap:28px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .qbtn{grid-template-columns:32px 1fr 28px}.qmeta{grid-column:2;justify-content:flex-start}.plus{grid-row:1;grid-column:3}
  .qbody .pad{padding-left:16px}
}
@media (max-width:600px){ .brand small{display:none} .search input{width:96px} .hits .lbl{display:none} }
@media (max-width:420px){ header .wrap{gap:10px} .brand>span{display:none} .search input{width:120px} }
/* 手機與減少動態：橫向序列改成手指左右滑 */
.hs.static .hs-sticky{position:relative;top:0;height:auto;overflow:visible}
.hs.static .track{overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:20px;transform:none!important;padding-left:20px}
.hs.static .gcard{scroll-snap-align:start}
@media (prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none;transition:none}
  .cue i{animation:none}
  .kcard .in,.scale .pin,.qbody,.blocks i{transition:none}
}
@media print{
  header,.top,.cue,.dial-hint,.pit,.pit-legend,.tabs{display:none}
  section.dark,.hero{background:#fff;color:#000;clip-path:none}
  .rv{opacity:1;transform:none}
  .hs-sticky{position:static;height:auto}.track{flex-wrap:wrap;transform:none!important}
  .qbody{grid-template-rows:1fr}
}
</style>

g": "Bank of America", "answerer": "董事長", "quote": "Yes, we now have a very strong demand from smartphone and also AI/HPC applications.", "tag": "良率"}, {"question": "電力是否限制客戶需求？", "answer": "電力是考量因素之一，已完成研究，目前沒有問題", "stance": "正面", "asker": "外資", "asker_name": "Arthur Lai", "asker_org": "Macquarie", "answerer": "董事長", "quote": "we have done all the study and so far, so good", "tag": "電力"}, {"question": "代理式 AI 的 CPU 需求是否納入 AI 加速器定義？", "answer": "未納入，因為無法區分 CPU 用於傳統或 AI 伺服器", "stance": "防禦性", "asker": "外資", "asker_name": "Arthur Lai", "asker_org": "Macquarie", "answerer": "董事長", "quote": "It's not included in our AI demand’s calculation", "tag": "AI 定義"}, {"question": "2027 年定價與毛利率的增減因素？", "answer": "定價策略依市場、地點與技術而定，未給數字", "stance": "避重就輕", "asker": "外資", "asker_name": "Sahej Singh", "asker_org": "Stifel", "answerer": "董事長", "quote": "our pricing strategy is very strategic.", "tag": "定價"}, {"question": "與 GlobalFoundries 的中介層合作怎麼看？", "answer": "是後段供應策略的一環，目標是讓客戶獲得充分供應", "stance": "正面", "asker": "外資", "asker_name": "Sahej Singh", "asker_org": "Stifel", "answerer": "董事長", "quote": "We designed a deal with GlobalFoundries.", "tag": "合作"}], "analysts": [{"name": "Laura Chen", "org": "Citi", "type": "外資", "questions": 2}, {"name": "Gokul Hariharan", "org": "JPMorgan", "type": "外資", "questions": 3}, {"name": "Krish Sankar", "org": "TD Cowen", "type": "外資", "questions": 2}, {"name": "Charlie Chan", "org": "Morgan Stanley", "type": "外資", "questions": 2}, {"name": "Sunny Lin", "org": "UBS", "type": "外資", "questions": 2}, {"name": "Haas Liu", "org": "Bank of America", "type": "外資", "questions": 2}, {"name": "Arthur Lai", "org": "Macquarie", "type": "外資", "questions": 2}, {"name": "Sahej Singh", "org": "Stifel", "type": "外資", "questions": 2}], "attendees": [{"name": "C.C. Wei", "title": "董事長", "sections": "簡報、Q&A"}, {"name": "Wendell Huang", "title": "財務長", "sections": "簡報、Q&A"}, {"name": "Jeff Su", "title": "投資人關係處處長（主持）", "sections": "簡報、Q&A"}], "keywords": [{"word": "capacity", "type": "positive", "count": 46}, {"word": "AI", "type": "positive", "count": 36}, {"word": "N2", "type": "positive", "count": 8}, {"word": "High NA", "type": "positive", "count": 7}, {"word": "A14", "type": "positive", "count": 6}, {"word": "Arizona", "type": "positive", "count": 6}, {"word": "agentic AI", "type": "positive", "count": 5}, {"word": "power", "type": "risk", "count": 14}, {"word": "dilution", "type": "risk", "count": 11}, {"word": "tool price", "type": "risk", "count": 5}, {"word": "consumer", "type": "risk", "count": 2}], "briefs": {"line": "幫大家同步一下台積電第三季法說會的重點：\n1. Q3 美元營收 467 億美元，季增 16.2%，高於財測高標；毛利率 66.4%，EPS 29.43 元。\n2. Q4 營收財測 523–543 億美元（中值季增 14%），毛利率 65%–67%。\n3. 全年美元營收成長從略高於 40% 上修到約 44%，資本預算維持 600–640 億美元。\n4. 管理層說 AI 需求極為強勁、看不到放緩；海外廠毛利稀釋未來幾年會擴大到 3%–4%。", "memo": "【台積電 2026 Q3 法說會摘要】\n整體來看，AI 需求持續超出預期，全年成長再度上修；擴產速度加快，但海外廠稀釋擴大與消費性市場疲弱是要留意的事。\n\n重點：\n1. 本季：美元營收 467 億美元，季增 16.2%；毛利率 66.4%，營益率 58.7%；EPS 29.43 元。\n2. 指引：Q4 營收 523–543 億美元，中值季增 14%、年增 58%；毛利率 65%–67%。\n3. 修正：全年成長由略高於 40% 上修至約 44%；資本預算維持 600–640 億美元；亞利桑那二廠略為提前至 2027 年第三季量產。\n4. Q&A：17 題中，2027 年資本支出、產能增幅、定價都不給數字；High NA 計畫 2030 年導入。\n5. 要留意：海外廠稀釋今年接近 2%，未來幾年擴大到 3%–4%；2027 年消費性市場審慎規劃。", "report": "台積電 2026 Q3 法說會重點\n\n結論：AI 需求強勁、全年成長上修至約 44%；擴產加速，海外稀釋將擴大。\n\n一、本季結果\n・美元營收 US$46.7B，季增 16.2%\n・毛利率 66.4%，營益率 58.7%，EPS NT$29.43，ROE 45.5%\n・2 奈米占晶圓營收 8%，先進製程 79%；HPC 占 68%，季增 22%\n・現金 NT$3.6 兆；存貨天數 82 天\n\n二、指引與修正（前次 → 本次）\n・2026 全年營收成長（美元）：略高於 40% → 約 44%\n・2026 資本預算：US$60–64B → US$60–64B（維持）\n・Q4 營收 US$52.3–54.3B，毛利率 65%–67%（與上季財測區間相同）\n・A14：2027 風險試產、2028 量產（維持）\n・亞利桑那二廠 2027 年第三季量產（略為提前）；台南加蓋 3 奈米廠\n\n三、Q&A 觀察\n・17 題中，正面 7 題、保守 1 題、防禦性 4 題、避重就輕 5 題\n・提問券商：Citi、JPMorgan、TD Cowen、Morgan Stanley、UBS、Bank of America、Macquarie、Stifel\n\n四、風險\n・海外廠毛利稀釋未來幾年擴大到 3%–4%\n・消費性市場受零組件漲價影響\n・電力供應\n\n資料來源：TSMC_3Q26_Transcript.pdf，與 2026/7/16 第二季法說會比較"}, "tone_scores": {"method": "詞表計分：(正向−負向)/(正向+負向)", "basis": "管理層", "language": "en", "presentation": {"score": 0.66, "label": "偏正向", "positive": 68, "negative": 14, "uncertainty": 3, "segments": 2, "chars": 12157, "words": 1911, "top_positive": ["strong", "increased", "leading", "increase", "growth"], "top_negative": ["dilution", "decreased", "declined", "decrease", "lower"], "top_uncertainty": ["assumption", "uncertainties", "prudent"]}, "qa": {"score": 0.78, "label": "偏正向", "positive": 40, "negative": 5, "uncertainty": 7, "segments": 22, "chars": 11285, "words": 2052, "top_positive": ["increase", "higher", "robust", "expand", "strong"], "top_negative": ["dilution", "slowdown", "inflation", "shortage"], "top_uncertainty": ["depends", "may", "might"]}, "warnings": []}, "generated": "2026-11-11 19:05", "ctx": {"src": {"cur": [{"sp": "", "ti": "", "sec": "presentation", "tx": "LSEG STREETEVENTS EDITED TRANSCRIPT 2330.TW - Q3 2026 Taiwan Semiconductor Manufacturing Company Limited Earnings Call (Chinese, English) EVENT DATE/TIME: OCTOBER 15, 2026 / 6:00AM GMT"}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "presentation", "tx": "(spoken in foreign language) Good afternoon, everyone, and welcome to TSMC's third quarter 2026 earnings conference call. This is Jeff Su, TSMC Director of Investor Relations and your host for today. TSMC is hosting our earnings conference call via live audio webcast through the company's website at www.tsmc.com, where you can also download the earnings release materials. (Operator Instructions) The format for today's event will be as follows. First, TSMC's Senior Vice President and CFO, Mr. Wendell Huang, will summarize our operations in the third quarter 2026, followed by our guidance for the fourth quarter 2026. Then Ms. [Fam] and TSMC's Chairman and CEO, Dr. C.C. Wei will jointly provide the company's key messages. That will be followed -- then we will open the line for the Q&A session. As usual, I'd like to -- I would like to remind everybody that today's discussions contain forward-looking statements that are subject to significant risks and uncertainties, which could cause the actual results to differ materially from those contained in the forward-looking statements. Please refer to the safe harbor notice that appears in our press release. And now I would like to turn the call over to TSMC's CFO, Mr. Wendell Huang, for the summary of operations and the current quarter guidance."}, {"sp": "Wendell Huang", "ti": "Senior Vice President and Chief Financial Officer / Spokesperson", "sec": "presentation", "tx": "Thank you, Jeff. Good afternoon, everyone. Thank you for joining us today. My presentation will start with financial highlights for the third quarter of 2026. After that, I will provide the guidance for the fourth quarter of 2026. Third quarter revenue increased 17.6% sequentially in NT, supported by strong demand for our leading-edge process technologies. In US dollar term, revenue increased 16.2% sequentially to $46.7 billion, above the high end of our third quarter guidance. Gross margin decreased by 1.3 percentage points sequentially to 66.4%, primarily due to margin dilution from 2-nanometer ramp. Total operating expenses accounted for 7.8% of net revenue. Operating margin was 58.7%. Overall, our third quarter EPS reached TWD29.43, and ROE was 45.5%. Now let's move on to revenue by technology. 2-nanometer process technology contributed 8% of wafer revenue in the third quarter, while 3-nanometer, 5-nanometer and 7-nanometer accounted for 33%, 28% and 10%, respectively. Advanced technologies, defined as 7-nanometer and below, accounted for 79% of wafer revenue. Moving on to revenue contribution by platform. HPC increased 22% quarter-over-quarter to account for 68% of our third quarter revenue. Smartphone increased 10% to account for 21%. IoT increased 5% to account for 4%. Automotive increased 23% to account for 4%. While DCE declined 12% to account for 1%. Moving on to the balance sheet. We ended the third quarter with cash and marketable securities of TWD4 trillion or USD126 billion. On the liability side, current liabilities increased by TWD110 billion quarter-over-quarter, mainly due to the increase of TWD46 billion in current portions of bond payable and bank loans, and TWD26 billion in dividend payable. In terms of financial ratios, accounts receivable turnover days decreased by 1 day to 28 days. Inventory days decreased by 5 days to 82 days, primarily due to the increase in wafer shipment. Regarding cash flow and CapEx, during the third quarter, we generated about TWD920 billion in cash from operations, spent TWD443 billion in CapEx, and distributed TWD156 billion for fourth quarter 2025 cash dividends. Overall, our cash balance increased TWD488 billion to TWD3.6 trillion at the end of the quarter. In US dollar terms, our third quarter capital expenditures totaled USD13.8 billion. I have finished my financial summary. Now let's turn to our current quarter guidance. Based on the current business outlook, we expect our fourth quarter revenue to be between USD52.3 billion and USD54.3 billion, which represents a 14% sequential increase or a 58% year-over-year increase at the midpoint. Based on the exchange rate assumption of USD1 to TWD31.8, gross margin is expected to be between 65% and 67%, operating margin between 56.5% and 58.5%. This concludes my financial presentation. Now let me turn to our key messages. I will start by talking about our third quarter '26 and fourth quarter of '26 profitability. Compared to the second quarter, our third quarter gross margin decreased by 130 basis points sequentially to 66.4%, primarily due to the margin dilution from the initial ramp-up of our 2-nanometer technology. We have just guided our fourth quarter gross margin to decrease by 40 basis points to 66% at the midpoint, primarily due to the continued margin dilution from the steep ramp-up of our 2-nanometer technology, as well as dilution from overseas fabs. These impacts are expected to be partially offset by cost improvement efforts, including productivity gains and across-node capacity optimization. While the cost of overseas fabs remain higher, thanks to the company's overall larger scale and cost improvement efforts, we now expect the gross margin dilution from the ramp-up of our overseas fabs to be closer to 2% for the full year 2026. As we put more effort to support the strong structural demand from our customers, more fabs will be ramping up in the US. Thus, we expect the dilution from our overseas fabs to widen to 3% to 4% in the next few years. We will leverage our increasing size in Arizona and work on our operations to improve the cost structure. We will also continue to work closely with our customers and suppliers to manage the impact. Overall, with our fundamental competitive advantages of manufacturing technology leadership and large-scale production base, we are confident that TSMC continues to be the most cost-efficient manufacturer in every region that we operate. Next, let me make some comments on our 2026 capital budget. At TSMC, a higher level of capital expenditures is always correlated with higher growth opportunities in the following years. Given the continued robust multiyear demand from our customers, including the emerging agentic AI market, we reiterate our full year 2026 capital budget to be between USD60 billion and USD64 billion. We continue to expect our CapEx dollars investment from 2026 to 2028 and to be even more significantly higher than the past three years, as we continue to invest heavily to support our customers' growth. Additionally, while the tool supply is tight, we always collaborate closely with our tool suppliers well in advance to prepare the capacity, just like our customers collaborate with us well in advance to plan our capacity. Even as we invest for the future growth with this level of CapEx spending in the next few years, we remain committed to delivering profitable growth to our shareholders. We also remain committed to a sustainable and steadily increasing cash dividend per share on both an annual and quarterly basis. Now let me turn the microphone over to C. C."}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "presentation", "tx": "Thank you, Wendell. Good afternoon, everyone. First, let me start with our near-term demand outlook. We concluded our third quarter with a revenue of USD46.7 billion higher than our guidance in US dollar terms, driven by strong demand for our leading-edge process technologies. Moving into fourth quarter 2026, we expect our business to be supported by continued strong demand for our leading-edge process technologies, including the steep ramp-up of our 2-nanometer technology. Looking ahead, we continue to observe consumer and price-sensitive end market segments are being challenged due to the impact of rising component prices and more economic uncertainties. As such, we are being prudent in our business planning going into 2027, while focusing on the fundamentals of our business to further strengthen our competitive position. Having said that, demand for our leading-edge technologies continues to be extremely robust, supported by our strong technology differentiation and broader customer base. Therefore, we now expect our full year 2026 revenue growth to be around 44% year-over-year in US dollar terms. Next, let me talk about the AI-related demand outlook. The AI market continues to be very strong. Recent developments are very positive to AI's long-term demand outlook. We observe increasing AI demand, fueled by the rising adoption of Agentic AI as we transition from chatbots to AI assistants. In addition, we are observing greater adoption of open-source AI models. This will drive greater efficiencies and help lower the barriers to future AI usage, and result in more and more demand for leading-edge silicon. Thus, AI-related demand is being supported by strong underlying demand for AI accelerators. In addition, the emergence of agentic AI CPUs and continued demand for networking chips are driving further silicon demand. Therefore, semiconductor will remain essential in the AI megatrend. The value of semiconductors in the global supply chain is set to continue to increase in our view. This will create more value opportunities for our customers to capture, and more value opportunities for TSMC as well. No matter which approach is taken, it will require use of the most advanced semiconductor process technologies. With our technology leadership, manufacturing excellence, global capacity expansion, and customer trust, we are well positioned to capture the multiyear structural AI-related demand. Therefore, all the AI players are working with TSMC. Next, let me talk about TSMC's capacity expansion strategies. As of foundry, our first responsibility is to provide our customer with the best technologies and effective capacity support to unleash their innovations. To address the structured increase in the long-term semiconductor market demand profile, TSMC collaborate closely with our customers and our customers are customers to plan for our capacity. In addition, we are now going one step further and sending our own teams of people to check on the data center build-out progress and power supply situation in the U.S. The feedback is so far so good, and the CSPs have been well prepared. Internally, TSMC employs a disciplined capacity planning system to assess the market demand, from both a top-down and bottom-up approach. This is a continuous and ongoing process. Given the fundamental complexity of leading-edge technologies and the design-in and lead time involved, we already have a very good idea of customers of multiyear product roadmap and production plans. Thus, we continue to hold strong conviction in the AI megatrend. We are moving full speed ahead to increase our capacity to meet our assessed demand and stepping up our CapEx investment to support our customers' future growth. TSMC is expanding at an unprecedented pace with nearly 20 fabs worldwide in progress. We are building 13 leading edge and advanced packaging fabs in Taiwan over the next several years, and another five to six fabs overseas. Our new node, N2, has already entered a high-volume manufacturing in the fourth quarter of 2025, with good yield. N2 is ramping successfully in multiple phases at both Hsinchu and Kaohsiung sites. We expect our N2 family technology’s annual capacity to more than double in 2027, supported by strong demand from both smartphone and HPC/AI applications. We are also leveraging our manufacturing excellence to generate more N2 wafer output, further increasing our capacity support to customers. In addition, we have already begun preparing the capacity for our A14 technology. Risk production is well on track for 2027, and volume production will start in 2028. Thus, TSMC's semiconductor technologies and manufacturing will continue to play a pivotal role in supporting the global semiconductor industry, while unleashing our customers' innovations. Now let me talk about TSMC's global N3 capacity expansion update. As we said before, historically, we do not add additional capacity to a node once it reaches its targeted capacity. However, based on our assessment, we are executing well on our global capacity plan to add 3 new fabs to support the robust multiyear pipeline or demand for 3-nanometer technologies. In Taiwan, volume production for our new 3-nanometer fab in Tainan Science Park is well on track to begin the first half of 2027. In addition, driven by the strong demand from our customers, we have decided to add on additional 3-nanometer fab in Tainan, volume production is scheduled for the first half of 2028. In Arizona, we have completed the construction of our second fab and are in the process of tool move-in and installation. Volume production will begin in third quarter '27, slightly ahead of our previous schedule. In Japan, we are progressing well to our plan to utilize 3-nanometer in our second fab and volume production is scheduled in 2028. In addition to all the new fabs, we continue to convert 5-nanometer tools to support 3-nanometer capacity in Tainan. We are also leveraging our manufacturing excellence to greater productivity across our fab in all locations to generate more wafer output. We are also focusing on capacity optimization across nodes, which includes flexible capacity support among N7, N5 and N3 nodes. Thus, we are using multiple levers to do everything we can, wherever we can, as fast as we can to maximize the support to our customers. We have no intention to leave food on the table for others, and we want to capture every piece of business possible. This concludes our key message, and thank you for your attention."}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "presentation", "tx": "Thank you, C.C. This concludes our prepared statements. (Event Instructions) Now let's begin the Q&A session. Operator, can we proceed with the first caller on the line, please?"}, {"sp": "Operator", "ti": "Operator", "sec": "qa", "tx": "Yes. First one, Laura Chen, Citi."}, {"sp": "Laura Chen", "ti": "Analyst", "sec": "qa", "tx": "I appreciate C.C. for sharing with us the TSMC capacity expansion strategy. So may I follow up more on that? Given the increasing aggressive AI semiconductor demand, how does TSMC now see the AI revenue CAGR growth? And how does TSMC reconcile customers’ capacity requirement with some of the potential concern on the data center power availability, and also maybe funding recently, and other critical components such as HBM, ABF advanced packaging. And also in the networking side, we see the tightness of laser as well. So if this constraint creates a mismatch between semiconductor supply and also actual AI development, how would TSMC adjust your capacity allocation and also the strategy to minimize the potential overbuilding in the supply chain. Thank you. That's my first question."}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Okay. Laura has a very involved first question. I think she's asking how do we see the AI demand outlook? The AI demand, as C.C. said, seems to be very strong, but she's worried or concerned. How do we reconcile the strong demand of chips, AI chips versus risks related to whether it be power supply. I think also like different bottlenecks within the supply chain et cetera, how do we make our assessment of what is the appropriate CapEx and capacity we need to prepare. Is that correct, Laura? ."}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "That's a long, long question. Laura, let me share with you. We have a very sophisticated capacity planning process. And we also have a very disciplined on our consideration. And let me share with you, we put every possibility we can, talking about the CSPs, CapEx, data centers’ build-out, financial, power supply, and also other components’ supply, et cetera, into our consideration. And so we make our own judgment -- and then based on our assessed demand, we still think the demand is higher than the supply, and we are working very hard to narrow the gap. Did I answer your question, Laura?"}, {"sp": "Laura Chen", "ti": "Analyst", "sec": "qa", "tx": "Sure. Thank you. Thank you very much. So far from our -- like the comprehensive starting the supply chain, we are still quite positive on the demand in the longer term, right? So in that case, can you also give us like more color about that but any update on your AI CAGR growth? I recall previously, we're talking about like high 50%?"}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "We -- sorry, sorry."}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Yes. So part of Laura's question is then based on our assessment, we had previously guided our AI CAGR -- AI accelerator CAGR, which is a narrow definition to grow mid- to high 50s percentage from 2024 to 2029. So Laura wants to know, do we have any update to that number today."}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "Laura, all I can say right now is the demand is very extremely robust, okay? And we did not see any sign of slowdown whether it's high 50% CAGR, it doesn't matter, it probably will be higher."}, {"sp": "Laura Chen", "ti": "Analyst", "sec": "qa", "tx": "Sure. Okay. Thank you. Yes. And my second question is also about the -- given the very strong demand in the CapEx cycle, we see that definitely this round will be much higher than before. And TSMC also announced that earlier you will adopt High NA EUV around 2030. So should we think about that, that will be further improve the productivities thus will be more meaningful for further like accelerating revenue growth in the longer term. And also given that the CapEx intensity are also getting much higher how should we think about that the pricing power and also the long-term gross margin, the capital efficiency return."}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Okay. That's actually two questions, but okay, just very quickly. So Laura, part of it is on -- with the strong demand on our CapEx cycle, how do we view the adoption of High NA, which we said we will in 2030? And then her question is on profitability, long-term outlook."}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "Okay. Let me answer that question. Yes. For the long-term productivity, we continue to improve it, and High NA definitely is a very good tool. And so far, I think our plan is to use it in 2030. Again, our CapEx will be much higher than today. And so you're talking about the gross margin, or the profitability can be increased or not? Let me say that there is no ceiling for TSMC's profitability, but a dramatic increase will not happen overnight either. So our philosophy or our strategy is always working with our customer, and we want to make them be successful, and then we can gain our value."}, {"sp": "Laura Chen", "ti": "Analyst", "sec": "qa", "tx": "Appreciate and congratulate the great result."}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Thank you. Operator, can we move on to the next participant, please?"}, {"sp": "Operator", "ti": "Operator", "sec": "qa", "tx": "Next one, Gokul Hariharan, JP Morgan."}, {"sp": "Gokul Hariharan", "ti": "Analyst", "sec": "qa", "tx": "My first question, again, on capacity addition. It looks like the shortage situation next year could be even more than 2026. Just wanted to hear C.C. your view on this. And I think it's been quite some time since we have seen TSMC add capacity at more than 10% every year. If you look at our annual report, it would be like about 10 years that you have added capacity of more than 10%. Given this accelerated build-out, can we start getting wafer capacity growth closer to 10% or even higher than 10% in the next couple of years. Any comment on like what is your planned wafer capacity growth in the next couple of years? That's my first question."}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Okay. So Gokul's first question is regarding the capacity addition and the demand. So his question first is the tightness in the wafer supply, do we think that will be even more or greater in 2027 than 2026? And then along with that, how do we see our overall capacity addition. Although you say 10%, I think every year, we disclose in the annual report, it's been about mid- to high single digit and sometimes even lower. But anyways, regardless, those are the two questions. So first on just the demand outlook and then the supply, will next year be even more tight than this year?"}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "I just mentioned, the demand is extremely robust and getting higher and higher. Of course, we have our own judgment, and we look at every angle. As I said, we talk to customer, customers’ customer, and then we do our own one more step to check the data centers’ build-out. All the result we put into our judgment and our assessment, the result is the demand is very, very high. And so the gap between demand and supply are still quite big, and that's why we put all our strengths to increase the capacity, as I just mentioned. Whether it's bigger or is the gap become bigger or the gap become narrow, we are working very hard. I cannot answer this question right now because of my customer continue to increase their demand."}, {"sp": "Wendell Huang", "ti": "Senior Vice President and Chief Financial Officer / Spokesperson", "sec": "qa", "tx": "Okay. Gokul, I think it's a bit too early to talk about capacity increase percentage going forward. But let me just remind you that the increase every year, although the number is -- even though the number may be small, but the increase in advanced packaging -- sorry, advanced nodes are really the main driver for the capacity increase, okay?"}, {"sp": "Gokul Hariharan", "ti": "Analyst", "sec": "qa", "tx": "Fair enough. Okay. Secondly, could you -- you alluded to more aggressive overseas expansion plan in the U.S. especially. And I think recently, there's been a lot of discussion with potentially a new fab cluster in Texas as well as I think one of your customers also talked about discussions with TSMC as well. So C.C., could you talk a little bit about your overseas plan, like the more accelerated kind of capacity build out -- and also any engagement with SpaceX or Tesla given your customer did call you out last week in terms of some engagements you have, like what are the broad contours of this engagement likely to be? Is it similar to what you've done with some of the customers in Japan and ESMC as well?"}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Okay. Thank you, Gokul. So Gokul's second question, he notes that C.C. said, we're expanding at unprecedented pace, doing everything we can, as fast as we can to increase the capacity. So this question is particularly to the U.S. what is the status or update. There's been reports that we are looking to expand in Texas. There's been reports that one of our customers, we are engaging in discussions. He wants to know what kind of framework or parameters of any cooperative maybe? Or any comment on either of those two things?"}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "Okay. Gokul, we work very hard to expand our capacity in U.S. This is necessary because of all our customers, most of large customers in U.S. and they request that TSMC to increase the capacity. And also US government are very helpful. So that's a place we want to expand. So recently, we did expand our capacity’s consideration to see outside Arizona where we can get another chance to expand our capacity. That Texas is one. So we send the teams to Texas to do all the evaluation. And we also talk to one of our customers who try to build a fab, Terafab, let me be more specific. And we discussed with them to see whether that we can be utilizing that actual capacity also. So we're still in discussion. If we have any solid conclusion, we will share with you. But today, and that's it. Yes, from Arizona to Texas, yes."}, {"sp": "Gokul Hariharan", "ti": "Analyst", "sec": "qa", "tx": "Okay. But all of these are going to be TSMC-run fabs, right? I think you're not becoming part of the Terafab project or anything like that. Can you just help us understand what are the principles that you are using here? Is it a similar principle that you use for JASM or ESMC?"}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Okay. So Gokul's question is not in particular to the potential cooperation with this customer. Would it be TSMC's owned? What's the principles that we have if anything?"}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "We are still in discussion. Let me say that. It's not either way, it would be possible, but the fab got to be run by TSMC."}, {"sp": "Operator", "ti": "Operator", "sec": "qa", "tx": ", can we move on to the next participant, please?"}, {"sp": "Operator", "ti": "Operator", "sec": "qa", "tx": "Yes, next one, Krish Sankar, TD Cowen."}, {"sp": "Krish Sankar", "ti": "Analyst", "sec": "qa", "tx": "I have two of them. The first one, C.C., some customers talk about a secondary wafer market where one customer passes their wafer allocation to another? Is this like a very small portion of the business? Is it customer specific? Or do you see that an emerging trend where customers whose demand is weak, pass some of their allocation to stronger customers? And then I had a quick follow-up."}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "All right, Krish, thank you. So Krish's first question is asking some of our customers are talking about a resell or a secondary wafer market where they can pass their allocation on. So -- is this a very small portion of our business? Or is this more of a trend for us to do? And is this something that we allow our customers to do."}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "Well, let me answer that. To say whether this is a new strategy, new methodology, the answer is no. The principle of TSMC is we do not allow our customers to sublet or auction off the capacity. But in certain cases, customers can collaborate through mask licensing agreement, but this is not our common practice. And the amount is very, very small. Krish, did I answer your question?"}, {"sp": "Krish Sankar", "ti": "Analyst", "sec": "qa", "tx": "Yes. And then a quick follow-up. You did touch upon it the High NA agreement with ASML from 2030 onwards. I'm just curious to know historically TSMC was more ahead of the curve with the EUV adoption. It looks like by the time you adopt High NA EUV, be it 2030, 2031, but some of your competitors would already been using it by then. So do you see that as a disadvantage? Or you're not worried about competition getting ahead with High NA EUV?"}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Okay. So Krish’s second question is looking at High NA. He notes some of our competitors are both using already adopted or will adopt High NA earlier than TSMC. So his question, does this put us at a competitive disadvantage or risk compared to our competitors in terms of technology leadership."}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "Krish, let me answer that. We always evaluate a new tool -- and if we want to put into the mass production, it got to be the best technology with a very reasonable cost. And most important is the best maturity, okay? So we say in 2030, we'll start to use it because we also think at the time, High NA will be mature. And we're also working very closely with ASML to establish a 12-inch photomask by 2031. And at that time, we think that the High NA's cost will be reasonable and for TSMC to make it into the mass production. And this is a very good tool. Let me emphasize that. And in the smaller geometry, it definitely has some advantages. Whether that our technology because we are using is later than our competitor, so a disadvantage to TSMC? No, because we have confidence that we are still the best company to offer the most advanced technology to our customers."}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Krish, does that answer your question?"}, {"sp": "Krish Sankar", "ti": "Analyst", "sec": "qa", "tx": "Thank you very much."}, {"sp": "Operator", "ti": "Operator", "sec": "qa", "tx": ", can we move on to the next participant, please?"}, {"sp": "Operator", "ti": "Operator", "sec": "qa", "tx": "Charlie Chan, Morgan Stanley."}, {"sp": "Charlie Chan", "ti": "Analyst", "sec": "qa", "tx": "And also glad to hear a very strong AI semi-demand amid some recent stock market correction. So my first question is really about your leading edge capacity expansion strategy. As far as I know one of your IDM customer is spending capex very aggressively. So there are some concern about this may insource more than outsource to you, right? So first of all, I'm not sure how you're going to deal with this sort of business opportunity? And secondly, I remember, last time that C.C., you mentioned about A14 could be a bigger node than N2. May I know whether they assume big IDM company will outsource more CPU like server CPU at A14?"}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Okay, so Charlie's first question is around IDM competitor. He wants to know very specifically if we see this competitor moving to insource more. So his question is then our prior comment of A14 being a larger, bigger node than N2 has even been, does this include the server CPU from this IDM competitor?"}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "Well, Charlie, we treat every customer fairly. So whether it's IDM or is purely fabless, we treat them the same. But of course, we take into consideration of their internal capacity. So we calculate our support. We calculate our capacity build-up according to our own judgment. Actually, in our A14, we have seen more and more customers actually higher than the 2-nanometer activities so far. And we expect that the A14 will be a bigger node than our current N2 technologies."}, {"sp": "Charlie Chan", "ti": "Analyst", "sec": "qa", "tx": "I see. So it doesn't need to consider this IDM will also outsource more. We can still have A14 to be a bigger node than N2. Is that the right understanding?"}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Well, again, Charlie wants to know very specifically this customer's outsourcing plan, which you probably may need to ask them, but yes."}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "Well, Charlie, as I said, to be frank with you, I don't comment on a specific customer, but let me guarantee you that we take everything into consideration. Okay?"}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Okay. Do you have a second question?"}, {"sp": "Charlie Chan", "ti": "Analyst", "sec": "qa", "tx": "Yes, I do. Thanks. -- the second question is a kind of follow-up about your advanced packaging. From what we're seeing that the reticle size is getting much bigger. C.C. said last time or even two quarters ago about your response, SoW, 3.5D, so lot's an initiative is going on. So my question is that do you think those are kind of CoPoS, SoW, 3.5D can really catch customers’ very rapid development of their larger reticle size chip like 14 reticle? And secondly, if some customer, they eventually choose to use Intel's EMIB-T and for some reason, cannot get to sufficient demand. Are you okay to bail out to support customers for the CoWoS version or capacity."}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "All right. So Charlie's second question is focused on the advanced packaging. I guess, Charlie, if I understand your question, summarize it, is, of course, customers are moving to larger and larger reticle size 14x. So he wants to know TSMC's roadmap and solutions and how competitive we can be against, I think he mentioned specifically our competitors, EMIB-T. So how do we view our solution? Is it as competitive as our competitor? That's the first part of his question."}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "All right, Charlie. Actually, I still think that TSMC's advanced assembly or they say, packaging technology are very, very competitive. But the most important thing is that we help our customers' product can be introduced in the market smoothly. That's our number one priority. So we have to offer them the best technology with enough capacity. So far, let me share with you our today's situation -- we are in the real world production of 5x reticle size. I don't believe that anybody can do that today, except the TSMC. And the yield is excellent. So our customers are very satisfied with the result. And then we are working on the 9x reticle size and moving into the 14x reticle size. Of course, we are also working on the CoPoS part and to make sure that in the future, we can offer a reasonable cost reduction. But so far, the CoWoS is still the number one choice for our customers. As time goes by, yes, our competitors offer a very competitive solution. Still, I want to say that today's situation, we are the only one that makes sure that the advanced packaging is a 5x reticle size. And still, we are very competitive. I want to emphasize that."}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "And then Charlie's question, if the competitor cannot deliver on their solution, Charlie, I think you're saying we willing to be something like a backup plan?"}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "I try to avoid to answer it directly, but let me say that. Yes, we will be number one priority. I already indicate that TSMC's customers product can be introduced into the market smoothly. That's the number one priority, okay? And that gives you enough hint."}, {"sp": "Charlie Chan", "ti": "Analyst", "sec": "qa", "tx": "Yes. Yes, indeed. Thanks for the answers. I hope that you don't give any food to others, including in the advanced packaging. Thank you."}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Thank you. All right, operator, let's move on to the next participant, please."}, {"sp": "Operator", "ti": "Operator", "sec": "qa", "tx": "Next one, Sunny Lin, UBS."}, {"sp": "Sunny Lin", "ti": "Analyst", "sec": "qa", "tx": "After -- so my first question is to have a bit more color on how we should think about CapEx beyond 2026. Recall a few quarters ago, you mentioned if you are doing your job well, then you may be able to drive CapEx to grow a bit less than top line. But now obviously, the overall call activity may have further strengthened, and you also willing to support your clients with more substantial expansion. And we therefore wonder, at this point, when you look at maybe the coming two years, would you expect maybe CapEx to grow a bit faster, maybe in line with sales or even a bit faster just like for 2026? And then meanwhile, obviously, the tool price is also increasing, given a very tight supply. And therefore, going to 2027, will a higher tool price also be a driver for higher CapEx as well."}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Higher, sorry. What was the last part of your question, Sunny? Higher tool price, higher what the top?"}, {"sp": "Sunny Lin", "ti": "Analyst", "sec": "qa", "tx": "Well, so yeah, when we think about 2027 CapEx, should we also consider tool price inflation to be a meaningful variable for a lot higher CapEx compared with this year?"}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Understood. Okay. Sorry. Okay. So Sunny's first question, -- it's about our CapEx beyond '26, really, she's asking '27 and '28, the next two years. With the strong, extremely robust demand that C. C. indicated, the question is around our capital intensity in the next 2 years. How do we see the capital intensity trending revenue growth versus a CapEx growth - part one, and then also the impact of tool inflation on the CapEx outlook as well."}, {"sp": "Wendell Huang", "ti": "Senior Vice President and Chief Financial Officer / Spokesperson", "sec": "qa", "tx": "Okay. Sunny, this is Wendell. It's a bit too early to share the CapEx number beyond this year. But as we said in the prepared remarks, we have a very strong conviction in the AI megatrend. Therefore, our CapEx from 2026 to 2028 and is expected to be significantly higher than the past three years. And this is a step-up of our investment to support the customers' growth. We have no intention to leave any food on the table for others. The tool price inflation is real. The tool price, material, labor costs, et cetera. However, the majority of the CapEx is always related to the long-term demand. So that will be the composition going forward. And capital intensity-wise -- as we always said, if we do our job right, the increase in revenue will outpace the increase in CapEx, and that is still the case from what we are looking at."}, {"sp": "Sunny Lin", "ti": "Analyst", "sec": "qa", "tx": "Thank you very much. If I may have a very quick follow-up on the CapEx side. Earlier, Wendell, you raised the margin dilution from overseas to I think 3% to 4% starting from 2027, given a faster overseas expansion. But for the US, you're still so far focused on Arizona. Does that imply for Arizona, the expansion for the second phase will happen very quickly -- or you're actually accelerating the expansion for the third phase or even the other phases as well as therefore the result for higher margin dilution for next year?"}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Okay. So Sunny's question is kind of about the puts and takes to next year's margin. She does note, as Wendell said in our prepared remarks that the overseas fabs will widen a bit to 3% to 4% in the next few years. So you wonder what's driving that wider dilution. C.C. did say we are pulling in the schedule for the second fab for 3-nanometer. Her question is, are we also pulling in third fab what's leading to this wider diluted? And maybe -- Yes."}, {"sp": "Wendell Huang", "ti": "Senior Vice President and Chief Financial Officer / Spokesperson", "sec": "qa", "tx": "Okay. Sunny, as we mentioned, we are doing everything we can, wherever we can to increase our capacity to meet the strong demand from the customers. And we are also accelerating everywhere, including in the U.S. We did mention before that the latter part of the five-year period, the dilution -- margin dilution from overseas fab will be 3 to 4 percentage points, and that still remains the case. So it's 3 to 4 percentage points in the second part of the five-year period."}, {"sp": "Sunny Lin", "ti": "Analyst", "sec": "qa", "tx": "Thank you very much for the clarification. My second question, I like to follow up on the point."}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "That was two questions, Sunny. That is already two questions. Can we -- sorry, but we probably just to accommodate as many as we can. We're going to move on. Operator, can we move to the next participant, please?"}, {"sp": "Operator", "ti": "Operator", "sec": "qa", "tx": "Next one, Haas Liu, Bank of America."}, {"sp": "Haas Liu", "ti": "Analyst", "sec": "qa", "tx": "Congrats on the great results. The first question would be on your view regarding the potential shift in AI demand mix. You mentioned in the prepared remarks that the AI accelerator chip set demand is proliferating into agentic AI demand, including CPUs and networking switches. We understand the overall AI investment is still pretty strong and even trending stronger across the board. But can we get more clarity that are you seeing your customers demand shifting toward more efficient compute solutions, especially as monetization gets more important? How should we think about the incremental opportunity for your manufacturing and packaging business?"}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "So Haas’ first question is on the AI-related demand. His question is, are we seeing a shift in the AI-related demand more and more to CPU or networking switches and away from AI accelerators, or any type of comment."}, {"sp": "C.C. Wei", "ti": "Chairman & Chief Executive Officer", "sec": "qa", "tx": "Well, all I can say is AI's demand is extremely robust, okay? Whether it comes from accelerator or is more from the CPU side. It's not for me to make a comment, although we did see the demand from agent AI CPU continue to increase. Yes, that is a trend today. And other than that, everything is very robust. And I want to emphasize again - in our judgment, we consider all the parameters, and the demand actually is still far above our capability today to supply. And we are working very hard to narrow the gap. That's all I can say."}, {"sp": "Haas Liu", "ti": "Analyst", "sec": "qa", "tx": "Okay. That's very clear. And my second question is just regarding the yield learning curve going forward for your dual technology tracks strategy going forward. So historically, I think you have been ramping up the yield of a new node through producing the chipsets with smaller die size and simpler design to improve the learning curve of new node. But for the future node plans are supporting both conventional power delivery for the applications like mobile and consumer applications and super power rail technology for HPC and AI chipsets, would operating two process architectures at the same make the learning curve more challenging or increased manufacturing complexity -- and how should we think about the implication to your gross margins from the yield and also cost control perspective?"}, {"sp": "Jeff Su", "ti": "Director of Investor Relations", "sec": "qa", "tx": "Okay. So Haas second question is -- his question is really about ramping a new node. -- the learning curve of yield and cost, and therefore, the implication to gross margin, really, I think, is what he's driving that. And his question is that in the past, new node is mostly ramped with smaller die size and simpler design. But -- so today, we have both the smartphone and also with the AI and HPC applications coming in, does that increase the complexity of the node proce
